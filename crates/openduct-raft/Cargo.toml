[package]
name = "openduct-raft"
description = "Replication for OpenDuct: brokers keep each other's copy of the log with Raft."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { version = "1.12.1", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
crc32c = "0.6.9"
hmac = "0.13.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
openduct-storage = { version = "0.1.0", path = "../openduct-storage" }
openraft = { version = "0.10.0", default-features = false, features = ["serde", "tokio-rt", "type-alias"] }
parking_lot = "0.13.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
