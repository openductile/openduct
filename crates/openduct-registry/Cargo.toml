[package]
name = "openduct-registry"
description = "OpenDuct's schema registry: subjects, versions and compatibility checks, with the REST API Confluent's serializers speak."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
kafka-protocol = { version = "0.18.0", default-features = false }
openduct-broker = { version = "0.1.0", path = "../openduct-broker" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
tracing = "0.1.44"

[dev-dependencies]
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
openduct-storage = { version = "0.1.0", path = "../openduct-storage" }
