[package]
name = "openduct-hostile"
description = "Hostile input for OpenDuct: every place it reads bytes it did not write, as one function each - for the random tests here and for fuzzing (fuzz/)."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
# The request types by API key, to decode whatever the broker's header check lets through. Only this crate turns
# the enums on; the broker itself never uses them.
kafka-protocol = { version = "0.18.0", default-features = false, features = ["broker", "client", "messages_enums"] }
openduct-broker = { version = "0.1.0", path = "../openduct-broker" }
openduct-connect = { version = "0.1.0", path = "../openduct-connect" }
openduct-expr = { version = "0.1.0", path = "../openduct-expr" }
openduct-pipeline = { version = "0.1.0", path = "../openduct-pipeline" }
openduct-storage = { version = "0.1.0", path = "../openduct-storage" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
