[package]
name = "openduct-storage"
description = "The OpenDuct log: Kafka record batches in memory or on local disk, with crash recovery."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
crc32c = "0.6.9"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
