[package]
name = "openduct-broker"
description = "The OpenDuct broker: the Kafka wire protocol over an OpenDuct store."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bytes = "1.12.1"
flate2 = "1.1.11"
kafka-protocol = { version = "0.18.0", default-features = false, features = ["broker", "client"] }
lz4_flex = "0.14.2"
openduct-storage = { version = "0.1.0", path = "../openduct-storage" }
parking_lot = "0.13.0"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103.17", default-features = false, features = ["std"] }
ruzstd = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
snap = "1.1.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rcgen = "0.14.10"
rskafka = { version = "0.6.0", default-features = false, features = ["transport-tls"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
