Copyright 2026 Ductile AI, Inc
SPDX-License-Identifier: Apache-2.0

The cluster's secret, made once at random and kept: an upgrade reads back the one made before, since a node given
another secret does not start.
*/}}
{{- if and (include "openduct.cluster" .) .Values.cluster.secret.create (not .Values.cluster.secret.existingSecret) }}
{{- $name := include "openduct.secretName" . }}
{{- $kept := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openduct.labels" . | nindent 4 }}
  annotations:
    # Kept when the release is removed: the data it seals would not open without it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $kept $kept.data (index $kept.data "secret") }}
  secret: {{ index $kept.data "secret" }}
  {{- else }}
  secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
