name: Feature request
description: Something OpenDuct should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work. For a protocol, storage or guarantee change, the design in a few lines.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
