name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The full matrix, macOS included, once a week and whenever it is started by hand.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Warnings are refused by clippy below, for this workspace's own crates. Not as a global RUSTFLAGS: that also
# reaches the vendored kafka-protocol, whose upstream code is kept as it came.
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost about ten times Linux ones where minutes are billed. In a private repository a
        # push or pull request runs Linux only; the weekly run and a run started by hand run macOS too. In a
        # public repository every run has both, and a pull request there needs this check on macOS to merge.
        os: >-
          ${{ fromJSON(github.event.repository.private
                       && github.event_name != 'schedule'
                       && github.event_name != 'workflow_dispatch'
                       && '["ubuntu-latest"]'
                       || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Line tables only in the test build: a panic still names its file and line, and the build fits the disk below.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The test build of this workspace outgrew the free disk of GitHub's Linux machines (about 14 GB): the linker
      # died writing a test binary ("Bus error"). Toolchains this job never uses are removed first.
      - name: Room on the disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # rustup reads rust-toolchain.toml and installs the pinned toolchain with clippy and rustfmt.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Each broker of a multi-broker test logs at info into OPENDUCT_TEST_LOG_DIR (crates/openduct/tests/cluster.rs),
      # kept when a test fails: a drill that fails only on a loaded runner can then be read, not guessed (2026-11-24,
      # the schema registry drill failed twice here and never on a laptop).
      - run: mkdir -p "$OPENDUCT_TEST_LOG_DIR" && cargo test --workspace --locked
        env:
          OPENDUCT_TEST_LOG_DIR: ${{ runner.temp }}/broker-logs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broker-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/broker-logs
          retention-days: 7
          if-no-files-found: ignore
          # The logs are named after each cluster's temporary directory, which starts with a dot.
          include-hidden-files: true
      - run: cargo build --release --locked -p openduct && ls -l target/release/openduct
      # openduct links no part of the Python interpreter: Python steps run in openduct-python.
      - run: "! cargo tree --locked -p openduct -e normal --prefix none | grep -E '^(rustpython|malachite)'"
      - run: cargo build --release --locked -p openduct-script --bin openduct-python && ls -l target/release/openduct-python
      - run: cargo build --release --locked -p openduct --no-default-features && ls -l target/release/openduct
      - name: Disk left
        if: always() && runner.os == 'Linux'
        run: df -h /

  cross:
    name: Builds for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf, x86_64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      # The TLS library (ring) compiles C and assembly for its target, so each target needs its C compiler.
      - name: C compiler for ${{ matrix.target }}
        run: |
          sudo apt-get update -qq
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) sudo apt-get install -y -qq gcc-aarch64-linux-gnu ;;
            armv7-unknown-linux-gnueabihf) sudo apt-get install -y -qq gcc-arm-linux-gnueabihf ;;
            x86_64-unknown-linux-musl)
              sudo apt-get install -y -qq musl-tools
              echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
              ;;
          esac
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo check --locked --release --target ${{ matrix.target }} -p openduct

  # The released Linux programs, built as the release builds them (against glibc 2.28), and run on the oldest
  # systems they promise: Debian 10 (glibc 2.28), and Ubuntu 20.04 and 22.04, which NVIDIA Jetson's JetPack 5 and 6
  # are built on - a JavaScript and a Python step included, in their own processes.
  older-linux:
    name: Runs on older Linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: older-linux-${{ matrix.target }}
      - uses: ./.github/actions/linux-programs
        with:
          target: ${{ matrix.target }}
      - name: Debian 10, Ubuntu 20.04 and Ubuntu 22.04
        env:
          PROGRAMS: target/${{ matrix.target }}/release
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/scripts.yaml" <<'EOF'
          name: scripts
          steps:
            - name: js
              javascript: "return { n: value.n * 2 };"
            - name: py
              python: "result = {\"n\": steps[\"js\"][\"n\"] + 1}"
          EOF
          echo '{"n": 20}' > "$RUNNER_TEMP/in.jsonl"
          for image in \
            debian:10@sha256:58ce6f1271ae1c8a2006ff7d3e54e9874d839f573d8009c20154ad0f2fb0a225 \
            ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 \
            ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde; do
            echo "::group::${image%@*}"
            docker run --rm -v "$PWD/$PROGRAMS:/programs:ro" -v "$RUNNER_TEMP:/work:ro" "$image" sh -c \
              'ldd --version | head -1 && /programs/openduct --version &&
               /programs/openduct workflow test /work/scripts.yaml --input /work/in.jsonl' | tee "$RUNNER_TEMP/out.json"
            echo "::endgroup::"
            # Each check on its own line: under `set -e` a failing first half of `a && b` would not stop the loop.
            grep -q '"status":"done"' "$RUNNER_TEMP/out.json" || { echo "::error::${image%@*}: the run did not finish"; exit 1; }
            grep -q '"n":41' "$RUNNER_TEMP/out.json" || { echo "::error::${image%@*}: the steps gave the wrong answer"; exit 1; }
          done

  # The studio's page: its types, its tests, its build (built into the program from ui/dist).
  studio-page:
    name: The studio's page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --version && npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  # The container image built and run: the studio answers, and a JavaScript and a Python step run in their own
  # processes on Linux (where they also give up file and network access).
  image:
    name: The container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg JOBS=4 -t openduct:ci .
      - name: Run it
        run: |
          docker run -d --name openduct -p 5480:5480 -e OPENDUCT_ADVERTISE=localhost:9092 \
            -e OPENDUCT_ALLOW_INSECURE=true openduct:ci
          for i in $(seq 1 60); do curl -sf http://localhost:5480/api/status && break; sleep 1; done
          curl -sf http://localhost:5480/api/status
      - name: A JavaScript and a Python step
        run: |
          docker exec openduct sh -c 'cat > /data/scripts.yaml <<EOF
          name: scripts
          steps:
            - name: js
              javascript: "return { n: value.n * 2 };"
            - name: py
              python: "result = {\"n\": steps[\"js\"][\"n\"] + 1}"
          EOF
          echo "{\"n\": 20}" > /data/in.jsonl
          openduct workflow test /data/scripts.yaml --input /data/in.jsonl' | tee out.json
          grep -q '"status":"done"' out.json && grep -q '"n":41' out.json
      - if: failure()
        run: docker logs openduct
      - run: docker save openduct:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  # deploy/compose started with the image: the studio answers, with tiered storage on (its bucket made at start).
  compose:
    name: Docker Compose
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Up
        working-directory: deploy/compose
        env:
          OPENDUCT_IMAGE: openduct:ci
        run: |
          gunzip -c ../../image.tar.gz | docker load
          { echo "OPENDUCT_CLUSTER_SECRET=$(openssl rand -hex 32)"; echo "S3_ACCESS_KEY=openduct";
            echo "S3_SECRET_KEY=$(openssl rand -hex 20)"; echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"; } > .env
          docker compose up -d --no-build --wait --wait-timeout 180 s3 postgres
          docker compose up -d --no-build openduct
          for i in $(seq 1 90); do curl -sf http://localhost:5480/api/status && break; sleep 2; done
          curl -sf http://localhost:5480/api/status
          docker compose logs openduct | grep -q "tiered storage on"
      - if: failure()
        working-directory: deploy/compose
        run: docker compose logs

  # deploy/opentofu/local: its providers found and its configuration valid (OpenTofu checked against its checksums).
  opentofu:
    name: The OpenTofu setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OpenTofu
        run: |
          v=1.12.11
          curl -sSLO "https://github.com/opentofu/opentofu/releases/download/v$v/tofu_${v}_linux_amd64.zip"
          curl -sSLO "https://github.com/opentofu/opentofu/releases/download/v$v/tofu_${v}_SHA256SUMS"
          grep " tofu_${v}_linux_amd64.zip$" "tofu_${v}_SHA256SUMS" | sha256sum -c
          unzip -q "tofu_${v}_linux_amd64.zip" tofu && sudo mv tofu /usr/local/bin/
      - working-directory: deploy/opentofu/local
        run: tofu fmt -check && tofu init -backend=false -input=false && tofu validate

  # deploy/kubernetes/openduct.yaml on a cluster made for the test: three nodes form one OpenDuct.
  kubernetes:
    name: Kubernetes
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: A cluster to test on (kind, checked against its published checksum)
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          curl -sSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum | sed 's|kind-linux-amd64|kind|' | sha256sum -c
          chmod +x kind && sudo mv kind /usr/local/bin/
          kind create cluster --name openduct --wait 120s
          gunzip -c image.tar.gz | docker load
          kind load docker-image openduct:ci --name openduct
      - name: Three nodes
        run: |
          kubectl create secret generic openduct-cluster --from-literal=secret="$(openssl rand -hex 32)"
          # One kind node on GitHub's 2-CPU Linux machine (a private repository's): kind's own pods ask for about one
          # CPU, so three brokers asking 500m each do not fit and the third waits Pending. The brokers' CPU request is
          # halved here; nothing else in the manifest changes.
          sed -e 's|image: openduct:local.*|image: openduct:ci|' -e 's|cpu: 500m|cpu: 250m|' deploy/kubernetes/openduct.yaml | kubectl apply -f -
          kubectl rollout status statefulset/openduct --timeout=300s
          kubectl exec openduct-0 -- openduct cluster status --bootstrap 127.0.0.1:9092 | tee status.txt
          test "$(grep -c '^broker ' status.txt)" -eq 3
      - if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods | grep -A6 -E '^Events:' || true
          for p in 0 1 2; do kubectl logs openduct-$p --tail=50 || true; done

  # cargo-fuzz (libFuzzer) over every target of crates/openduct-hostile, half a minute each, on nightly Rust (its
  # sanitizer flags need it; the pinned toolchain stays for everything else). fuzz/ is its own workspace: none of it
  # is built into OpenDuct. A finding prints the input that caused it.
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: fuzz
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Each target for 30 seconds
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -rss_limit_mb=2048 -timeout=10
            echo "::endgroup::"
          done

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

