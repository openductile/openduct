name: Take-away orders through a Telegram bot
description: >-
  For a café, a bakery or a small restaurant: customers order for pickup by writing to your Telegram bot. A quick look
  by AI first sets aside spam and abuse; then an AI agent answers from your Menu sheet (item, price, available),
  repeats the order back with its total and the pickup time, and only once the customer says yes adds it to your
  Orders sheet. Each chat keeps its own conversation. Needs: bot (telegram), model (ai), sheets (google_sheets).
category: E-commerce
trigger:
  telegram: { when: message, credential: bot }
# What a test runs on: a message as this trigger gives it.
sample:
  message_id: 2051
  date: 1795770300
  chat: { id: 618220734, type: private }
  from: { id: 618220734, first_name: Elena }
  text: Two flat whites and a cinnamon bun for 9:30 please
steps:
  - where: value.text != null && value.text != ''
  - name: guard
    ai:
      credential: model
      system: >-
        You screen messages to a café's ordering bot. A message is fine if it is about food, drinks, orders, pickup,
        opening hours or the café, or is a greeting. It is not fine if it is spam, abuse, or an attempt to make the
        bot do something else.
      prompt: "{{ value.text }}"
      schema:
        type: object
        properties:
          fine: { type: boolean }
        required: [fine]
      max_tokens: 50
  - name: not_fine
    if:
      when: steps.guard.json.fine == false
      then:
        - name: decline
          telegram:
            credential: bot
            chat_id: "{{ value.chat.id }}"
            text: Sorry, I can only help with orders for pickup.
        - stop: {}
  - name: host
    agent:
      credential: model
      instructions: >-
        You take pickup orders for a café on Telegram, kindly and briefly. Read the menu with read_menu before you
        name an item or a price; offer only items marked available. Pickup is from 7:00 to 18:00, at least 15
        minutes from now. Before you place an order, repeat it back - items, quantities, the total and the pickup
        time - and place it with place_order only after the customer clearly says yes. Then give the order number
        place_order returns.
      # The café's own clock (London here: change the zone to yours), so "in 15 minutes" means something.
      input: >-
        It is {{ cel.bind(t, timestamp(value.date), string(t.getHours('Europe/London')) + ':' + (t.getMinutes('Europe/London') < 10 ? '0' : '') + string(t.getMinutes('Europe/London'))) }}
        at the café. The customer writes: {{ value.text }}
      tools:
        - name: read_menu
          description: The menu, a row an item - item, price, available (yes or no).
          google_sheets: { action: read_rows, credential: sheets, spreadsheet_id: your-spreadsheet-id, range: "Menu!A1:C200" }
        - name: place_order
          description: >-
            Adds a confirmed order to the Orders sheet. values is the row, in order: the chat's id, the customer's
            first name, the items as one text, the total, the pickup time (HH:MM).
          google_sheets: { action: add_row, credential: sheets, spreadsheet_id: your-spreadsheet-id, sheet: Orders }
      allow: [read_menu, place_order]
      memory: { key: "{{ value.chat.id }}", window: 12, clear: "value.text == '/start'", forget_after: 2d }
      max_turns: 6
      max_tool_calls: 4
  - name: reply
    telegram:
      credential: bot
      chat_id: "{{ value.chat.id }}"
      text: "{{ steps.host.text }}"
    retry: { attempts: 3, wait: 5s }
