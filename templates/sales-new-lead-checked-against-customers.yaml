name: A new lead, checked against your customers first
description: >-
  When your site's contact form posts a lead to this workflow (with its token), your MySQL shop database is asked
  whether they are already a customer: a customer's message goes straight to their account manager by e-mail, with
  their orders and last order date; a new lead is kept in your leads table and gets a welcome e-mail with what
  happens next. The form is answered with which it was. For shops and B2B sellers whose customers also use the
  contact form. Needs: shop_db, mail.
category: Sales
trigger:
  # Left empty here: each workflow made from the template is given a token of its own.
  webhook: { token: "" }
# What a test runs on: an event as this trigger gives it.
sample:
  name: Luis Ortega
  email: Luis.Ortega@pinecrest.example
  company: Pinecrest Cafes
  message: We run four cafes and would like wholesale prices for your oat milk.
steps:
  - name: who
    set:
      email: value.email.trim().lowerAscii()
  - where: steps.who.email.matches('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
  - name: customer
    mysql:
      credential: shop_db
      sql: >-
        SELECT c.id, c.name, c.account_manager_email, COUNT(o.id) AS orders, MAX(o.created_at) AS last_order
        FROM customers c LEFT JOIN orders o ON o.customer_id = c.id
        WHERE c.email = ? GROUP BY c.id, c.name, c.account_manager_email LIMIT 1
      params: [steps.who.email]
      read_only: true
  - name: route
    if:
      when: steps.customer.count > 0
      then:
        - name: to_manager
          email:
            credential: mail
            to: "{{ steps.customer.rows[0].account_manager_email != null ? steps.customer.rows[0].account_manager_email : 'sales@example.com' }}"
            reply_to: "{{ steps.who.email }}"
            subject: "Your customer {{ steps.customer.rows[0].name }} wrote through the site"
            text: >-
              {{ value.name }} ({{ steps.who.email }}, {{ value.company }}) - {{ steps.customer.rows[0].orders }}
              orders, the last on {{ steps.customer.rows[0].last_order }}:


              {{ value.message }}
      else:
        - name: keep_lead
          mysql:
            credential: shop_db
            sql: >-
              INSERT INTO leads (email, name, company, message, created_at) VALUES (?, ?, ?, ?, UTC_TIMESTAMP())
              ON DUPLICATE KEY UPDATE message = VALUES(message), created_at = VALUES(created_at)
            params: [steps.who.email, value.name, value.company, value.message]
        - name: welcome
          email:
            credential: mail
            to: "{{ steps.who.email }}"
            reply_to: sales@example.com
            subject: "Thank you, {{ value.name }} - here is what happens next"
            text: >-
              Hello {{ value.name }}, thank you for getting in touch about {{ value.company }}. Someone from our
              sales team will write to you within one working day with prices and samples. If it is urgent, just
              reply to this e-mail.
  - name: reply
    respond:
      status: 200
      body: { received: true, existing_customer: "{{ steps.customer.count > 0 }}" }
