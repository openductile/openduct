name: Post new orders to Discord
description: >-
  When an order comes in over a webhook ({"id", "customer", "total"}), post it to a Discord channel through the
  channel's webhook.
category: Messaging
trigger:
  webhook: {}
# What a test runs on: an event as this trigger gives it.
sample:
  id: A-100
  customer: Ada Lovelace
  total: 76
steps:
  - name: post
    discord:
      credential: orders-channel
      username: Orders
      text: "New order {{ value.id }} from {{ value.customer }}: {{ value.total }}"
