name: Book a customer callback in your support calendar
description: >-
  Your chatbot or site calls this workflow (with its token) - or an AI assistant calls it as a tool through the
  workspace's MCP server - when a customer would rather talk: the first free half hour in your support calendar is
  found, on a weekday within business hours on your clock, at least two hours ahead and in the part of the day the
  customer prefers; the callback is booked with the customer invited, and the caller is told the time to show them.
  For support teams that offer "we'll call you" without the back-and-forth. Needs: google_calendar.
category: Support
trigger:
  # Left empty here: each workflow made from the template is given a token of its own.
  webhook: { token: "" }
# Also offered to AI assistants through the workspace's MCP server.
tool:
  name: book_a_callback
  description: Books a phone callback with our support team at the first free time, and says when it is.
  input:
    name: { type: string, description: "The customer's name", required: true }
    email: { type: string, description: "The customer's e-mail, for the invitation", required: true }
    phone: { type: string, description: The number to call, required: true }
    topic: { type: string, description: "What it is about, in a few words", required: true }
    preferred: { type: string, choices: [morning, afternoon, any], description: When they would like the call }
# What a test runs on: what the caller sends.
sample:
  name: Carla Mendes
  email: carla.mendes@example.com
  phone: "+1 555 0142 778"
  topic: Moving my subscription to the annual plan
  preferred: afternoon
steps:
  - where: has(value.email) && value.email.contains('@') && has(value.phone) && value.phone != ''
  - name: now
    datetime: { timezone: America/New_York }
  - name: busy
    google_calendar:
      action: list_events
      credential: google_calendar
      # The support team's calendar: its id, from the calendar's settings.
      calendar_id: support-callbacks@example.com
      from: "{{ steps.now.utc }}"
      to: "{{ string(timestamp(steps.now.utc) + duration('168h')) }}"
    retry: { attempts: 3, wait: 15s }
  # The first free half hour: weekdays, 9:00 to 17:00 on the calendar's clock, two hours ahead at least.
  - name: slot
    javascript: |
      const OPEN = 9, CLOSE = 17, LUNCH = 12, MINUTES = 30, LEAD_HOURS = 2;
      const offset = steps.now.iso.slice(19);                 // the clock's offset now, as -05:00
      const sign = offset[0] === "-" ? -1 : 1;
      const offsetMin = sign * (Number(offset.slice(1, 3)) * 60 + Number(offset.slice(4, 6)));
      const busy = (Array.isArray(steps.busy) ? steps.busy : [])
        .filter(e => e.start && e.start.dateTime && e.end && e.end.dateTime)
        .map(e => [Date.parse(e.start.dateTime), Date.parse(e.end.dateTime)]);
      const prefer = value.preferred || "any";
      const earliest = steps.now.unix * 1000 + LEAD_HOURS * 3600e3;
      const pad = n => String(n).padStart(2, "0");
      const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      let found = null;
      // Half hours from now on, on the calendar's clock, for a week.
      let t = Math.ceil(earliest / (MINUTES * 60e3)) * MINUTES * 60e3;
      for (let i = 0; i < 7 * 48 && !found; i++, t += MINUTES * 60e3) {
        const local = new Date(t + offsetMin * 60e3);         // its fields read as the local clock
        const h = local.getUTCHours(), day = local.getUTCDay();
        if (day === 0 || day === 6 || h < OPEN || h >= CLOSE) continue;
        if (prefer === "morning" && h >= LUNCH) continue;
        if (prefer === "afternoon" && h < LUNCH) continue;
        const end = t + MINUTES * 60e3;
        if (busy.some(([s, e]) => s < end && e > t)) continue;
        const stamp = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:00${offset}`;
        const localEnd = new Date(end + offsetMin * 60e3);
        found = {
          start: stamp(local),
          end: stamp(localEnd),
          text: `${DAYS[day]} ${local.getUTCDate()}/${local.getUTCMonth() + 1} at ${pad(h)}:${pad(local.getUTCMinutes())} (UTC${offset})`,
        };
      }
      return found ? { ok: true, ...found } : { ok: false };
  - name: none_free
    if:
      when: "!steps.slot.ok"
      then:
        - respond:
            status: 200
            body: { booked: false, message: "No callback time is free this week: a person from our team will write to you instead." }
        - stop: {}
  - name: book
    google_calendar:
      action: add_event
      credential: google_calendar
      calendar_id: support-callbacks@example.com
      title: "Callback: {{ value.name }} - {{ value.topic }}"
      start: "{{ steps.slot.start }}"
      end: "{{ steps.slot.end }}"
      description: "Call {{ value.name }} on {{ value.phone }} about: {{ value.topic }}"
      attendees: "{{ [value.email] }}"
    retry: { attempts: 3, wait: 15s }
  - name: reply
    respond:
      status: 200
      body:
        booked: true
        when: "{{ steps.slot.text }}"
        message: "We will call you on {{ value.phone }} on {{ steps.slot.text }}. The invitation is in your inbox."
