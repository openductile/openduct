name: Tech news on your topics, by meaning, to Telegram
description: >-
  Every two hours, reads the newest Hacker News stories, keeps those closest in meaning to the topics you describe
  (compared as embeddings, so "Postgres replication" finds "logical decoding in PG 18" too), leaves out any story sent
  before, and sends the best five to your Telegram chat with their links. A data table remembers what was sent. For
  engineers and founders who want the signal without the scroll. Needs: model (with an embedding model), telegram;
  a table hn_sent (story_id text, title text).
category: Engineering
trigger:
  schedule: { every: 2h }
# What a test runs on: an event as this trigger gives it.
sample:
  scheduled_at: "2026-11-27T14:00:00Z"
steps:
  - name: interests
    set:
      # Say what you care about, in your own words.
      topics: "'Postgres and database internals, event streaming and Kafka, Rust in production, running AI models cheaply'"
      since: int(timestamp(value.scheduled_at)) - 7200
  - name: stories
    http:
      url: https://hn.algolia.com/api/v1/search_by_date
      query:
        tags: story
        numericFilters: "created_at_i>{{ steps.interests.since }},points>2"
        hitsPerPage: "50"
      sample:
        hits:
          - { objectID: "46120011", title: "Logical decoding in PostgreSQL 18, explained", url: "https://blog.example.com/pg18-decoding", points: 41, num_comments: 12 }
          - { objectID: "46120020", title: "A hand-made mechanical keyboard from walnut", url: "https://makers.example.org/walnut", points: 18, num_comments: 4 }
          - { objectID: "46120035", title: "We moved our queue workers from Go to Rust", url: "https://eng.example.net/rust-workers", points: 27, num_comments: 9 }
    retry: { attempts: 3, wait: 1m }
  - where: has(steps.stories.body.hits) && size(steps.stories.body.hits) > 0
  - name: vectors
    embed:
      credential: model
      input: "{{ [steps.interests.topics] + steps.stories.body.hits.map(h, h.title) }}"
    retry: { attempts: 2, wait: 30s }
  - name: sent_before
    table: { name: hn_sent, action: get, sort: -created_at, limit: 1000 }
  # Ranks the stories by how close their titles are to the topics; without vectors, by points.
  - name: pick
    javascript: |
      const hits = (steps.stories.body && steps.stories.body.hits) || [];
      const sent = new Set((steps.sent_before || []).map(r => String(r.story_id)));
      const vectors = (steps.vectors && steps.vectors.embeddings) || [];
      const cosine = (a, b) => {
        let dot = 0, na = 0, nb = 0;
        for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
        return na && nb ? dot / Math.sqrt(na * nb) : 0;
      };
      const topics = vectors[0];
      const MIN = 0.3; // closeness needed, 0 to 1: raise it for fewer, closer stories
      const ranked = hits
        .map((h, i) => ({
          id: String(h.objectID),
          title: h.title,
          url: h.url || `https://news.ycombinator.com/item?id=${h.objectID}`,
          points: h.points || 0,
          score: topics && vectors[i + 1] ? cosine(topics, vectors[i + 1]) : null,
        }))
        .filter(s => !sent.has(s.id) && (s.score === null || s.score >= MIN))
        .sort((a, b) => (b.score ?? 0) - (a.score ?? 0) || b.points - a.points)
        .slice(0, 5);
      return {
        count: ranked.length,
        rows: ranked.map(s => ({ story_id: s.id, title: s.title })),
        text: ranked.map((s, i) => `${i + 1}. ${s.title} (${s.points} points)\n${s.url}`).join("\n\n"),
      };
  - where: steps.pick.count > 0
  - name: remember
    table: { name: hn_sent, action: insert, rows: steps.pick.rows }
  - name: send
    telegram:
      action: send
      credential: telegram
      # Your chat with the bot: its id (the bot's getUpdates shows it), or @yourchannel.
      chat_id: "123456789"
      text: "{{ steps.pick.text }}"
    retry: { attempts: 3, wait: 30s }
