name: Route a topic's records by type
description: >-
  Read the events topic as it is written: orders go to the orders topic, everything else to the other-events topic,
  each keyed as it came.
category: Streaming
trigger:
  topic: { name: events }
# What a test runs on: an event as this trigger gives it.
sample:
  type: order
  id: A-100
  total: 76
steps:
  - name: route
    if:
      when: value.type == "order"
      then:
        - topic:
            name: orders
            key: "{{ trigger.key }}"
      else:
        - topic:
            name: other-events
            key: "{{ trigger.key }}"
