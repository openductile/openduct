name: Check a website every hour
description: Every hour, call an address and send the run to CatchErr when it does not answer 200, so you see each outage in the history.
category: Monitoring
trigger:
  schedule: { every: 1h }
# What a test runs on: an event as this trigger gives it.
sample:
  scheduled_at: '2026-11-17T09:00:00Z'
steps:
  - name: call
    http:
      # Your own site's address.
      url: https://example.com/health
      timeout: 10s
  - where: steps.call.status != 200
  - stop:
      error: "the site answered {{ steps.call.status }}"
