name: Teams channel messages sorted by AI
description: >-
  Each new message in a Teams channel is read in full, sorted by a model - an order, a complaint, a question or other
  - and answered in its thread with the team that will take it. Turning the workflow on subscribes it to the
  channel's new messages with Microsoft Graph; it renews itself every 20 minutes.
category: AI
trigger:
  teams: { when: new_message, credential: teams, team_id: fbe2bf47-16c8-47cf-b4a5-4b9b187c508b, channel_id: "19:4a95f7d8db4c4e7fae857bcebe0623e6@thread.tacv2" }
# What a test runs on: a new message as this trigger gives it.
sample:
  kind: channel
  team_id: fbe2bf47-16c8-47cf-b4a5-4b9b187c508b
  channel_id: "19:4a95f7d8db4c4e7fae857bcebe0623e6@thread.tacv2"
  chat_id: ""
  message_id: "1612293113399"
  reply_id: ""
  resource: "teams('fbe2bf47-16c8-47cf-b4a5-4b9b187c508b')/channels('19:4a95f7d8db4c4e7fae857bcebe0623e6@thread.tacv2')/messages('1612293113399')"
steps:
  - name: message
    teams:
      action: read_message
      credential: teams
      team_id: "{{ value.team_id }}"
      channel_id: "{{ value.channel_id }}"
      message_id: "{{ value.message_id }}"
      reply_id: "{{ value.reply_id }}"
  - name: sorted
    classify:
      credential: model
      text: "{{ steps.message.body.content }}"
      categories:
        - { name: order, description: "Someone wants to buy, change or cancel an order" }
        - { name: complaint, description: "Something went wrong for a customer" }
        - { name: question, description: "A question about products, prices or opening hours" }
  - name: answered
    teams:
      action: reply_in_thread
      credential: teams
      team_id: "{{ value.team_id }}"
      channel_id: "{{ value.channel_id }}"
      message_id: "{{ value.message_id }}"
      text: "Sorted as {{ steps.sorted.category }}: {{ steps.sorted.category == 'order' ? 'Sales' : (steps.sorted.category == 'complaint' ? 'Customer care' : 'The front desk') }} will take it."
