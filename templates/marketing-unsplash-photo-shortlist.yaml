name: A shortlist of free photos for a blog post
description: >-
  For writers and marketers: press Run with a topic and get a spreadsheet of up to 15 landscape photos from Unsplash
  that fit it - each one's description, its size, a link to look at it and the credit line Unsplash asks you to show
  beside it. The spreadsheet stays in the run's history to download; change the topic and the number in the first step,
  or send them with the run. Needs: an Unsplash access key, as a header credential called unsplash (Authorization:
  Client-ID <your key>).
category: Marketing
trigger: manual
# What a test runs on: what the run is given (both are optional: the first step says what is used without them).
sample:
  topic: coffee shop interior
  count: 10
steps:
  - name: ask
    set:
      # Change these, or send {"topic": ..., "count": ...} with the run.
      topic: "has(value.topic) && value.topic != '' ? value.topic : 'team working in an office'"
      count: "has(value.count) ? math.least(int(value.count), 15) : 10"
  - name: search
    http:
      method: GET
      url: https://api.unsplash.com/search/photos
      credential: unsplash
      headers: { Accept-Version: v1 }
      query:
        query: "{{ steps.ask.topic }}"
        per_page: "{{ steps.ask.count }}"
        orientation: landscape
        content_filter: high
      # A test answers with this, sending nothing: a short answer in Unsplash's own shape.
      sample:
        total: 2
        results:
          - id: Xa1b2C3d4E5
            description: A bright cafe with wooden tables
            alt_description: people sitting at tables in a cafe
            width: 6000
            height: 4000
            links: { html: "https://unsplash.com/photos/Xa1b2C3d4E5" }
            user: { name: Ada Example, links: { html: "https://unsplash.com/@ada_example" } }
          - id: Yf6g7H8i9J0
            description: null
            alt_description: a cup of coffee on a counter
            width: 5184
            height: 3456
            links: { html: "https://unsplash.com/photos/Yf6g7H8i9J0" }
            user: { name: Ben Sample, links: { html: "https://unsplash.com/@ben_sample" } }
    retry: { attempts: 3, wait: 5s }
  - name: found
    if:
      when: size(steps.search.body.results) == 0
      then:
        - stop: { error: "Unsplash found no photos for {{ steps.ask.topic }}: try other words" }
  - name: photos
    set:
      rows: >-
        steps.search.body.results.map(p, {
          'photo': p.links.html,
          'about': p.description != null ? p.description : (p.alt_description != null ? p.alt_description : ''),
          'size': string(p.width) + ' x ' + string(p.height),
          'credit': 'Photo by ' + p.user.name + ' on Unsplash',
          'photographer': p.user.links.html + '?utm_source=your_app&utm_medium=referral'
        })
  - name: shortlist
    convert:
      format: xlsx
      rows: steps.photos.rows
      columns: [photo, about, size, credit, photographer]
      sheet: Photos
      name: "photos-{{ steps.ask.topic.replace(' ', '-') }}.xlsx"
