name: Each engineer's open urgent incidents, by Outlook every morning
description: >-
  Each weekday at 9:00, reads the open priority 1 and 2 incidents from ServiceNow, works out how long each has been
  open against its target (4 hours for P1, 24 for P2), and e-mails each assignee from Outlook only their own list,
  the overdue ones first; unassigned incidents go to the operations lead. The day's counts are added as a row of an
  Excel table in OneDrive, for the monthly review. For IT and operations teams. Needs: servicenow (a user name and
  password), microsoft_365.
category: Operations
trigger:
  schedule: { every: weekday, at: "09:00", timezone: America/Chicago }
# What a test runs on: an event as this trigger gives it.
sample:
  scheduled_at: "2026-11-30T15:00:00Z"
steps:
  - name: incidents
    http:
      # Your instance's address.
      url: https://yourinstance.service-now.com/api/now/table/incident
      credential: servicenow
      query:
        sysparm_query: "active=true^priorityIN1,2^ORDERBYpriority"
        sysparm_fields: number,short_description,priority,opened_at,assigned_to.email
        sysparm_limit: "500"
      sample:
        result:
          - { number: INC0012041, short_description: Checkout API returns 502 for some cards, priority: "1", opened_at: "2026-11-30 09:10:00", assigned_to.email: ravi.k@example.com }
          - { number: INC0012033, short_description: VPN drops every 20 minutes in the Austin office, priority: "2", opened_at: "2026-11-28 16:45:00", assigned_to.email: ravi.k@example.com }
          - { number: INC0012050, short_description: Label printer offline at warehouse B, priority: "2", opened_at: "2026-11-30 13:30:00", assigned_to.email: "" }
    retry: { attempts: 3, wait: 1m }
  # Each incident's age against its target, grouped by who it is assigned to.
  - name: lists
    python: |
      from datetime import datetime, timezone

      LEAD = "ops-lead@example.com"           # gets the unassigned ones
      TARGET_HOURS = {"1": 4, "2": 24}
      now = datetime.fromisoformat(value["scheduled_at"].replace("Z", "+00:00"))

      people = {}
      overdue_total = 0
      rows = (steps["incidents"].get("body") or {}).get("result") or []
      for r in rows:
          opened = datetime.strptime(r["opened_at"], "%Y-%m-%d %H:%M:%S").replace(tzinfo=timezone.utc)
          hours = round((now - opened).total_seconds() / 3600, 1)
          target = TARGET_HOURS.get(str(r.get("priority")), 24)
          overdue = hours > target
          overdue_total += overdue
          who = (r.get("assigned_to.email") or "").strip().lower() or LEAD
          people.setdefault(who, []).append({
              "line": f"{'OVERDUE ' if overdue else ''}P{r['priority']} {r['number']} - {r['short_description']} (open {hours}h, target {target}h)",
              "overdue": overdue,
              "priority": str(r["priority"]),
              "hours": hours,
          })

      out = []
      for email, items in people.items():
          items.sort(key=lambda i: (not i["overdue"], i["priority"], -i["hours"]))
          late = sum(i["overdue"] for i in items)
          out.append({
              "email": email,
              "subject": f"Your open incidents: {len(items)}" + (f", {late} overdue" if late else ""),
              "text": "\n".join(i["line"] for i in items),
          })
      result = {
          "people": out,
          "total": len(rows),
          "p1": sum(1 for r in rows if str(r.get("priority")) == "1"),
          "overdue": overdue_total,
          "day": value["scheduled_at"][:10],
      }
  - name: tell
    for_each:
      items: steps.lists.people
      steps:
        - name: mail
          microsoft_365:
            action: send_email
            credential: microsoft_365
            to: "{{ item.email }}"
            subject: "{{ item.subject }}"
            text: "Good morning. Your open urgent incidents, the overdue ones first:\n\n{{ item.text }}"
          retry: { attempts: 3, wait: 15s }
  - name: count
    microsoft_365:
      action: add_excel_row
      credential: microsoft_365
      # The workbook's id in OneDrive, and the name of its table (Insert, Table in Excel).
      file_id: your-workbook-id
      table: Incidents
      values: "{{ [steps.lists.day, steps.lists.total, steps.lists.p1, steps.lists.overdue] }}"
    retry: { attempts: 3, wait: 15s }
