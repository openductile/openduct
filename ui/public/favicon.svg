<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>OpenDuct</title>
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C62A1E"/>
      <stop offset="0.45" stop-color="#F05A44"/>
      <stop offset="1" stop-color="#C62A1E"/>
    </linearGradient>
    <linearGradient id="run" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F26450"/>
      <stop offset="1" stop-color="#C62A1E"/>
    </linearGradient>
  </defs>
  <!-- The run: up out of the ground, over, and down again. -->
  <path d="M7.5 30V15.5a5.5 5.5 0 0 1 5.5-5.5h6a5.5 5.5 0 0 1 5.5 5.5V30" fill="none" stroke="url(#run)" stroke-width="5.2"/>
  <!-- Flanged joints on each leg and either side of the valve. -->
  <rect x="3.9" y="19.2" width="7.2" height="2.4" rx="0.9" fill="#9E1F15"/>
  <rect x="20.9" y="19.2" width="7.2" height="2.4" rx="0.9" fill="#9E1F15"/>
  <rect x="11.6" y="6.4" width="2.4" height="7.2" rx="0.9" fill="#9E1F15"/>
  <rect x="18" y="6.4" width="2.4" height="7.2" rx="0.9" fill="#9E1F15"/>
  <!-- The valve: its stem and handwheel. -->
  <rect x="15.2" y="3.4" width="1.6" height="4" fill="#9E1F15"/>
  <rect x="12.4" y="1.8" width="7.2" height="2.2" rx="1.1" fill="#9E1F15"/>
  <!-- Where it meets the ground. -->
  <rect x="2.5" y="29" width="27" height="1.6" rx="0.8" fill="#9E1F15" opacity="0.35"/>
</svg>
