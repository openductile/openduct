      attachments: "{{ input.attachments }}"
      user_id: "{{ input.user_id }}"
      from_address: "{{ input.from_address }}"
      html_content: "{{ base64.encode(bytes(input.html)) }}"
      plain_content: "{{ base64.encode(bytes(input.text)) }}"
      address_field: "{{ input.address_field }}"
triggers:
  new_contact:
    label: A new contact
    description: Each contact added, the newest asked for every few minutes.
    poll:
      action: list_contacts
      input: { order_by: create_time desc }
      newest_first: true
      id: item.id
      every: 5m
  updated_contact:
    label: A contact added or changed
    description: Each contact added or changed, the last changed asked for every few minutes.
    poll:
      action: list_contacts
      input: { order_by: update_time desc }
      newest_first: true
      id: item.id
      version: item.update_time
      every: 5m
  new_order:
    label: A new order
    description: Each order made, the newest asked for every few minutes.
    poll:
      action: list_orders
      input: { order_by: order_time desc }
      newest_first: true
      id: item.id
      every: 5m
