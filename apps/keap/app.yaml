# Keap: made by `openduct app from-openapi` from https://github.com/infusionsoft/keap-sdk/blob/c386b1ea7d13/sdks/v2/swagger.yml (the description says Apache 2.0; the repository is MIT) (Keap API v2, OpenAPI 3.1).
# Checked as made. Change what you like, then run `openduct app check` and `openduct app test` again.
app: keap
name: Keap
category: crm
description: "Contacts, companies, tags, notes, tasks, opportunities and orders in Keap; emails sent and campaign goals reached."
docs: "https://developer.keap.com/docs/restv2/"
hosts: [api.keap.com]
base_url: "https://api.keap.com/crm"
sign_in:
  - id: keap
    label: "Sign in with Keap"
    oauth2:
      authorize: "https://accounts.infusionsoft.com/app/oauth/authorize"
      token: "https://api.infusionsoft.com/token"
      # Keap's only scope.
      scopes: [full]
    headers: { Authorization: "Bearer {{ credential.access_token }}" }
  - id: keap_key
    label: "A personal access token or service account key"
    fields: [{ name: api_key, label: "The personal access token or service account key", secret: true }]
    headers: { Authorization: "Bearer {{ credential.api_key }}" }
actions:
  list_tasks:
    label: "List tasks"
    description: "Tasks, filtered and ordered as asked, every page."
    method: GET
    path: "/rest/v2/tasks"
    inputs:
      - name: filter
        label: "A filter, such as email==ann@example.com (the fields it takes are below)"
        description: "Filter to apply, allowed fields are: - (String) contact_id - (String) has_due_date - (String) is_completed - (String) user_id - (String) opportunity_id - (String) task_ids - (String) priority — one of CRITICAL, ESSENTIAL, NONESSENTIAL - (String) since_time - (String) until_time - (String) id —…"
      - { name: order_by, label: "Order: a field and asc or desc, such as create_time desc" }
    query: { filter: "{{ input.filter }}", order_by: "{{ input.order_by }}", page_size: "100" }
    items: value.tasks
    next: "value.next_page_token == null || value.next_page_token == '' ? null : {'page_token': value.next_page_token}"
    output:
      id: text
      title: text
      description: text
      type: text
      priority: text
      completed: boolean
      create_time: text
      modification_time: text
      completion_time: text
      due_time: text
      remind_time_mins: number
      assigned_to_user_id: text
      created_by_user_id: text
      last_updated_by_user_id: text
      contact_id: text
      opportunity_id: text
      accepted: boolean
      custom_fields: list
  list_tags:
    label: "List tags"
    description: "The tags of the account; filter==NONE finds those with an empty field."
    method: GET
    path: "/rest/v2/tags"
    inputs:
      - name: filter
        label: "A filter, such as email==ann@example.com (the fields it takes are below)"
        description: "Filter to apply, allowed fields are: - (String) name - (String) description - (String) category_id - (String) tag_ids - (String) since_create_time - (String) until_create_time - (String) since_update_time - (String) until_update_time You will need to apply the == operator to check the equality of…"
      - { name: order_by, label: "Order: a field and asc or desc, such as create_time desc" }
    query: { filter: "{{ input.filter }}", order_by: "{{ input.order_by }}", page_size: "100" }
    items: value.tags
    next: "value.next_page_token == null || value.next_page_token == '' ? null : {'page_token': value.next_page_token}"
    output:
      id: text
      name: text
      description: text
      category: record
      create_time: text
      update_time: text
  list_orders:
    label: "List orders"
    description: "Orders, filtered and ordered as asked, every page."
    method: GET
    path: "/rest/v2/orders"
    inputs:
      - name: filter
        label: "A filter, such as email==ann@example.com (the fields it takes are below)"
        description: "Filter to apply, allowed fields are: - (String) id - Allowable operators: \"==\",\"<=\", \"<\", \">=\", \">\", \"!=\" - (List[String]) ids - (String) product_id - (String) contact_id - (String) invoice_id - (String) invoice_xid - (Boolean) paid - (String) created_since_time - (String) created_until_time -…"
