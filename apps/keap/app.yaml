    label: "Achieve a campaign goal"
    description: "Tells an automation that a contact reached one of its API goals (by its integration and call name), so the contact moves on in it."
    write: true
    method: POST
    path: "/rest/v2/automations/goals/achieve"
    inputs:
      - { name: integration, label: "The goal's integration name (as set in the API goal)" }
      - { name: call_name, label: "The goal's call name (as set in the API goal)" }
      - { name: automation_id, label: "The automation ID", kind: number }
      - { name: goal_id, label: "The goal ID within the automation", kind: number }
      - name: contact_id
        label: "The contact ID for whom to achieve the goal"
        required: true
        kind: number
    send:
      integration: "{{ input.integration }}"
      call_name: "{{ input.call_name }}"
      automation_id: "{{ input.automation_id }}"
      goal_id: "{{ input.goal_id }}"
      contact_id: "{{ input.contact_id }}"
    output: { results: list }
