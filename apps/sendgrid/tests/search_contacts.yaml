description: Contacts at one domain, found with SendGrid's query language
action: search_contacts
credential: { token: SG.test-key }
input: { query: "email LIKE '%@example.com'" }
exchanges:
  - sent:
      method: POST
      url: https://api.sendgrid.com/v3/marketing/contacts/search
      body: { query: "email LIKE '%@example.com'" }
    answer:
      body:
        result:
          - { id: 3d5f1c2a-7b9e-4c1d-8e2f-a1b2c3d4e5f6, email: ann@example.com, first_name: Ann, list_ids: [] }
          - { id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d, email: bo@example.com, first_name: Bo, list_ids: [] }
        contact_count: 2
        _metadata: { self: "https://api.sendgrid.com/v3/marketing/contacts/search" }
result:
  - { id: 3d5f1c2a-7b9e-4c1d-8e2f-a1b2c3d4e5f6, email: ann@example.com, first_name: Ann, list_ids: [] }
  - { id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d, email: bo@example.com, first_name: Bo, list_ids: [] }
