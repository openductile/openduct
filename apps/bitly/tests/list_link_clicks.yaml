# Made by `openduct app from-openapi`: Get Clicks for a Bitlink.
description: "Get Clicks for a Bitlink, made from the API description's schemas"
action: list_link_clicks
credential: { token: test-token }
input: { bitlink: example }
exchanges:
  - sent:
      method: GET
      url: "https://api-ssl.bitly.com/v4/bitlinks/example/clicks"
      query: { unit: day, units: "-1" }
      headers: { authorization: "Bearer test-token" }
    answer:
      status: 200
      body: { link_clicks: [{ clicks: 1, date: example }], units: 1, unit: minute, unit_reference: example }
result: [{ clicks: 1, date: example }]
