app: teams
name: Microsoft Teams
category: messaging
description: Post messages to a Teams channel through its webhook.
docs: https://learn.microsoft.com/microsoftteams/platform/webhooks-and-connectors/how-to/add-incoming-webhook
sign_in:
  - id: teams_webhook
    label: A Microsoft Teams webhook
    fields:
      - { name: url, label: "The webhook's address", secret: true }
    url_field: url
default_action: send
actions:
  send:
    label: Post a message
    write: true
    method: POST
    inputs:
      - { name: text, label: The message, required: true }
    send: { text: "{{ input.text }}" }
    result: "{'sent': true, 'answer': value}"
