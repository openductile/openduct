description: Turning the workflow on subscribes its address to a channel's new messages, for under an hour, with a secret
trigger: new_message
register: true
workflow: wf1
address: https://studio.example/hooks/h1
sign_in: teams
credential: { access_token: eyJ0.teams }
input: { team_id: fbe2bf47-16c8-47cf-b4a5-4b9b187c508b, channel_id: "19:4a95f7d8db4c4e7fae857bcebe0623e6@thread.tacv2" }
exchanges:
  - sent:
      method: POST
      url: https://graph.microsoft.com/v1.0/subscriptions
      body:
        changeType: created
        notificationUrl: https://studio.example/hooks/h1
        resource: "/teams/fbe2bf47-16c8-47cf-b4a5-4b9b187c508b/channels/19:4a95f7d8db4c4e7fae857bcebe0623e6@thread.tacv2/messages"
        includeResourceData: false
        expirationDateTime: "2023-11-14T23:08:20Z"
        clientState: recorded-secret
    answer: { status: 201, body: { id: 7f105c7d-2dc5-4530-97cd-4e7ae6534c07, resource: "/teams/fbe2bf47-16c8-47cf-b4a5-4b9b187c508b/channels/19:4a95f7d8db4c4e7fae857bcebe0623e6@thread.tacv2/messages", expirationDateTime: "2023-11-14T23:08:20Z" } }
kept: { client_state: recorded-secret, subscription_id: 7f105c7d-2dc5-4530-97cd-4e7ae6534c07, address: "https://studio.example/hooks/h1" }
