app: square
name: Square
category: payments
description: Customers and payments in Square.
docs: https://developer.squareup.com/reference/square
hosts: [connect.squareup.com, connect.squareupsandbox.com]
base_url: https://connect.squareup.com/v2
sign_in:
  - id: square
    label: An access token
    fields:
      - { name: access_token, label: "The access token (production)", secret: true }
      - { name: webhook_secret, label: "A webhook subscription's signature key, for one added by hand", secret: true, optional: true }
    headers:
      Authorization: "Bearer {{ credential.access_token }}"
      Square-Version: "2025-01-23"
  - id: square_sandbox
    label: A sandbox access token (for testing)
    base_url: https://connect.squareupsandbox.com/v2
    fields:
      - { name: access_token, label: "The sandbox access token", secret: true }
      - { name: webhook_secret, label: "A webhook subscription's signature key, for one added by hand", secret: true, optional: true }
    headers:
      Authorization: "Bearer {{ credential.access_token }}"
      Square-Version: "2025-01-23"
error: value.errors[0].detail
actions:
  create_customer:
    label: Add a customer
    write: true
    method: POST
    path: /customers
    inputs:
      - { name: email, label: Email, required: true }
      - { name: given_name, label: First name }
      - { name: family_name, label: Last name }
      - { name: phone, label: Phone }
    send:
      email_address: "{{ input.email }}"
      given_name: "{{ input.given_name }}"
      family_name: "{{ input.family_name }}"
      phone_number: "{{ input.phone }}"
    result: value.customer
  list_payments:
    label: List payments
    method: GET
    path: /payments
    inputs:
      - { name: begin_time, label: "From (RFC 3339, such as 2026-11-01T00:00:00Z)" }
    query: { begin_time: "{{ input.begin_time }}" }
    items: value.payments
    next: "value.cursor == null ? null : {'cursor': value.cursor}"
triggers:
  payment:
    label: A payment made (or changed)
    description: >-
      Each payment of the kinds chosen, as Square sends it, signed with the subscription's key over the workflow's
      address and the delivery. Turning the workflow on subscribes its address, and turning it off deletes the
      subscription.
    inputs:
      - { name: events, label: "Which, separated by commas: payment.created, payment.updated", description: "payment.created when empty" }
    webhook:
      signature: { header: x-square-hmacsha256-signature, encoding: base64, signed: "{address}{body}" }
      secret: webhook_secret
      id: value.event_id
      only: "(input.events == null ? ['payment.created'] : input.events.split(',').map(e, e.trim())).exists(e, e == value.type)"
      event: value.data.object.payment
      register:
        - method: POST
          path: /webhooks/subscriptions
          send:
            idempotency_key: "openduct-{{ input.workflow }}-{{ input.secret }}"
            subscription:
              name: "OpenDuct workflow {{ input.workflow }}"
              event_types: "{{ input.events == null ? ['payment.created'] : input.events.split(',').map(e, e.trim()) }}"
              notification_url: "{{ input.address }}"
      keep: { webhook_secret: value.subscription.signature_key, webhook_id: value.subscription.id }
      unregister:
        - { method: DELETE, path: "/webhooks/subscriptions/{{ input.registered.webhook_id }}" }
