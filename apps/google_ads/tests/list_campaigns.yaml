description: The account's campaigns, each row's campaign
action: list_campaigns
credential: { access_token: ya29.test }
input: { customer_id: 123-456-7890, developer_token: devtok-test }
exchanges:
  - sent:
      method: POST
      url: "https://googleads.googleapis.com/v26/customers/1234567890/googleAds:search"
      headers: { authorization: Bearer ya29.test, developer-token: devtok-test }
      body:
        query: "SELECT campaign.id, campaign.name, campaign.status, campaign.serving_status, campaign.advertising_channel_type, campaign.campaign_budget FROM campaign WHERE campaign.status != 'REMOVED' ORDER BY campaign.id"
    answer:
      status: 200
      body:
        results:
          - campaign: { resourceName: customers/1234567890/campaigns/111, id: "111", name: Winter sale, status: ENABLED, servingStatus: SERVING, advertisingChannelType: SEARCH, campaignBudget: customers/1234567890/campaignBudgets/71 }
result:
  - { resourceName: customers/1234567890/campaigns/111, id: "111", name: Winter sale, status: ENABLED, servingStatus: SERVING, advertisingChannelType: SEARCH, campaignBudget: customers/1234567890/campaignBudgets/71 }
