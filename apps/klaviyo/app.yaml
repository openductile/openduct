    label: "Create Campaign Message"
    description: "Create a campaign message."
    write: true
    method: POST
    path: "/api/campaign-messages"
    inputs:
      - { name: definition, label: Definition, required: true, kind: record }
      - { name: variations, label: "The variations for this message", kind: list }
      - { name: relationships, label: Relationships, required: true, kind: record }
    headers: { revision: "2026-10-15" }
    send:
      data:
        type: campaign-message
        attributes: { definition: "{{ input.definition }}", variations: "{{ input.variations }}" }
        relationships: "{{ input.relationships }}"
    output: { data: record, links: record, meta: record }
  create_object_type:
    label: "Create Object Type"
    description: "Create an object type."
    write: true
    method: POST
    path: "/api/object-types"
    inputs:
      - { name: title, label: "The title for this object type", required: true }
      - { name: description, label: "The description of this object type" }
      - { name: visibility, label: "The visibility of this object type" }
      - { name: namespace, label: "The namespace of this object type" }
      - { name: object_schema, label: "The object schema to create with this object type", kind: record }
    headers: { revision: "2026-10-15" }
    send:
      data:
        type: object-type
        attributes:
          title: "{{ input.title }}"
          description: "{{ input.description }}"
          visibility: "{{ input.visibility }}"
          namespace: "{{ input['namespace'] }}"
          object-schema: "{{ input.object_schema }}"
    output: { data: record, links: record, meta: record }
  create_object_schema:
    label: "Create Object Schema"
