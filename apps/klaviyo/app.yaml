      - { name: first_name, label: "Individual's first name" }
      - { name: last_name, label: "Individual's last name" }
      - name: organization
        label: "Name of the company or organization within the company for whom the individual…"
      - name: locale
        label: "The locale of the profile, in the IETF BCP 47 language tag format like (ISO…"
        description: "The locale of the profile, in the IETF BCP 47 language tag format like (ISO 639-1/2)-(ISO 3166 alpha-2)"
      - { name: title, label: "Individual's job title" }
      - { name: image, label: "URL pointing to the location of a profile image" }
      - { name: location, label: Location, kind: record }
      - name: properties
        label: "An object containing key/value pairs for any custom properties assigned to this…"
        kind: record
    headers: { revision: "2026-10-15" }
    send:
      data:
        type: profile
        attributes:
          email: "{{ input.email }}"
          phone_number: "{{ input.phone_number }}"
          external_id: "{{ input.external_id }}"
          first_name: "{{ input.first_name }}"
          last_name: "{{ input.last_name }}"
          organization: "{{ input.organization }}"
          locale: "{{ input.locale }}"
          title: "{{ input.title }}"
          image: "{{ input.image }}"
          location: "{{ input.location }}"
          properties: "{{ input.properties }}"
    output: { data: record, links: record, meta: record }
  create_tag:
    label: "Create Tag"
    description: "Create a tag."
    write: true
    method: POST
    path: "/api/tags"
    inputs:
      - { name: name, label: "The Tag name", required: true }
      - { name: relationships, label: Relationships, kind: record }
    headers: { revision: "2026-10-15" }
    send:
      data:
        type: tag
        attributes: { name: "{{ input.name }}" }
        relationships: "{{ input.relationships }}"
    output: { data: record, links: record, meta: record }
  get_campaign_message:
    label: "Get Campaign Message"
    description: "Get a campaign message by ID."
    method: GET
