      - name: filter
        label: Filter
        description: "For more information please visit https://developers.klaviyo.com/en/v2026-10-15/reference/api-overview#filtering Allowed field(s)/operator(s): name: contains, ends-with, equals, starts-with (string)"
      - name: sort
        label: Sort
        description: "For more information please visit https://developers.klaviyo.com/en/v2026-10-15/reference/api-overview#sorting"
    query: { filter: "{{ input.filter }}", sort: "{{ input.sort }}", "page[size]": "50" }
    headers: { revision: "2026-10-15" }
    items: value.data
    next: "value.links.next == null || value.links.next == '' ? null : (value.links.next.startsWith('http') ? value.links.next : 'https://a.klaviyo.com' + value.links.next)"
    output: { type: text, id: text, attributes: record, relationships: record, links: record }
  list_object_schemas:
    label: "Get Object Schema Relationships"
    description: "Get related object schemas for an object schema *Rate limits*: Burst: 3/s Steady: 60/m Scopes: custom-objects:read OpenAPI Spec"
    method: GET
    path: "/api/object-schemas/{{ input.id }}/relationships/object-schemas"
    inputs: [{ name: id, label: "The ULID ID of the object schema", required: true }]
    headers: { revision: "2026-10-15" }
    items: value.data
    next: "value.links.next == null || value.links.next == '' ? null : (value.links.next.startsWith('http') ? value.links.next : 'https://a.klaviyo.com' + value.links.next)"
    output: { type: text, id: text }
