          description: "{{ input.description }}"
          status: "{{ input.status }}"
          required: "{{ input.required }}"
          source-mapping: "{{ input.source_mapping }}"
        relationships: "{{ input.relationships }}"
    output: { data: record, links: record, meta: record }
  create_profile:
    label: "Create Profile"
    description: "Create a new profile."
    write: true
    method: POST
    path: "/api/profiles"
    inputs:
      - { name: email, label: "Individual's email address" }
      - { name: phone_number, label: "Individual's phone number in E.164 format" }
      - name: external_id
        label: "A unique identifier used by customers to associate Klaviyo profiles with…"
