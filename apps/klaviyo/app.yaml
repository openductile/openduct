# Checked as made. Change what you like, then run `openduct app check` and `openduct app test` again.
app: klaviyo
name: Klaviyo
category: email
description: "The Klaviyo REST API."
docs: "https://developers.klaviyo.com"
hosts: [a.klaviyo.com]
base_url: "https://a.klaviyo.com"
sign_in:
  - id: klaviyo
    label: "An API key"
    fields:
      - name: api_key
        label: "The whole Authorization value, as Klaviyo's API reference writes it"
        secret: true
    headers: { Authorization: "{{ credential.api_key }}" }
actions:
  list_campaign_messages:
    label: "Get Campaign Messages"
    description: "Returns campaign messages based on filters."
    method: GET
    path: "/api/campaign-messages"
    inputs:
      - name: filter
        label: Filter
        description: "For more information please visit https://developers.klaviyo.com/en/v2026-10-15/reference/api-overview#filtering Allowed field(s)/operator(s): id: any, equals (string) campaign_id: equals (string) name: contains (string) status: equals (string) created: greater-or-equal, greater-than,…"
      - name: sort
        label: Sort
        description: "For more information please visit https://developers.klaviyo.com/en/v2026-10-15/reference/api-overview#sorting"
    query: { filter: "{{ input.filter }}", sort: "{{ input.sort }}", "page[size]": "100" }
    headers: { revision: "2026-10-15" }
    items: value.data
    next: "value.links.next == null || value.links.next == '' ? null : (value.links.next.startsWith('http') ? value.links.next : 'https://a.klaviyo.com' + value.links.next)"
    output: { type: text, id: text, attributes: record, relationships: record, links: record }
  list_object_types:
    label: "Get Object Types"
    description: "Get all object types in an account."
    method: GET
    path: "/api/object-types"
    inputs:
      - name: filter
        label: Filter
        description: "For more information please visit https://developers.klaviyo.com/en/v2026-10-15/reference/api-overview#filtering Allowed field(s)/operator(s): namespace: equals (string)"
    query: { filter: "{{ input.filter }}" }
    headers: { revision: "2026-10-15" }
    items: value.data
    next: "value.links.next == null || value.links.next == '' ? null : (value.links.next.startsWith('http') ? value.links.next : 'https://a.klaviyo.com' + value.links.next)"
    output: { type: text, id: text, attributes: record, relationships: record, links: record }
  list_profiles:
    label: "Get Profiles"
    description: "Get all profiles in an account."
    method: GET
    path: "/api/profiles"
    inputs:
      - name: filter
        label: Filter
        description: "For more information please visit https://developers.klaviyo.com/en/v2026-10-15/reference/api-overview#filtering Allowed field(s)/operator(s): id: any, equals (string) email: any, equals (string) phone_number: any, equals (string) external_id: any, equals (string) _kx: equals (string) created:…"
      - name: sort
        label: Sort
        description: "For more information please visit https://developers.klaviyo.com/en/v2026-10-15/reference/api-overview#sorting"
    query: { filter: "{{ input.filter }}", sort: "{{ input.sort }}", "page[size]": "100" }
    headers: { revision: "2026-10-15" }
    items: value.data
    next: "value.links.next == null || value.links.next == '' ? null : (value.links.next.startsWith('http') ? value.links.next : 'https://a.klaviyo.com' + value.links.next)"
    output: { type: text, attributes: record, id: text, relationships: record, links: record }
  list_tags:
    label: "Get Tags"
    description: "List all tags in an account."
    method: GET
    path: "/api/tags"
