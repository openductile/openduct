description: A stream whose data is collected in the EU sends to Google's EU address
action: send_event
sign_in: google_analytics_events
credential: { measurement_id: G-TEST12345, api_secret: test-secret-1, region: eu }
input: { client_id: "1234567890.1700000000", event: generate_lead, user_id: crm-42 }
exchanges:
  - sent:
      method: POST
      url: https://region1.google-analytics.com/mp/collect
      body: { client_id: "1234567890.1700000000", user_id: crm-42, events: [{ name: generate_lead }] }
    answer: { status: 204 }
result: { sent: true }
