description: Contacts added since the poll before, the newest asked for by Agile CRM's dynamic filter
trigger: new_contact
credential: {domain: shopexample, email: dana@shop.example, api_key: agile-test-key}
seen:
  items:
  - ['5629585249009664', '']
exchanges:
- sent:
    method: POST
    url: https://shopexample.agilecrm.com/dev/api/filters/filter/dynamic-filter
    headers: {authorization: Basic ZGFuYUBzaG9wLmV4YW1wbGU6YWdpbGUtdGVzdC1rZXk=, accept: application/json}
    query: {}
    body: {page_size: '50', global_sort_key: -created_time, filterJson: '{"rules":[{"LHS":"created_time","CONDITION":"LAST","RHS":"1"}],"or_rules":[],"contact_type":"PERSON"}'}
  answer:
    status: 200
    body:
    - &id004
      id: '5629585249009665'
      type: PERSON
      created_time: '1764241200'
      updated_time: 1764241200
      star_value: 4
      lead_score: 10
      tags: &id001 [Lead]
      properties:
      - {type: SYSTEM, name: first_name, value: Bob}
      - {type: SYSTEM, name: email, value: bob@example.com, subtype: work}
      contact_company_id: null
      owner: &id002 {id: 6263975862861824, email: dana@shop.example, name: Dana Example}
      campaignStatus: &id003 []
    - id: '5629585249009664'
      type: PERSON
      created_time: '1764237600'
      updated_time: 1764237600
      star_value: 4
      lead_score: 10
      tags: *id001
      properties:
      - {type: SYSTEM, name: first_name, value: Ann}
      - {type: SYSTEM, name: last_name, value: Example}
      - {type: SYSTEM, name: email, value: ann@example.com, subtype: work}
      contact_company_id: null
      owner: *id002
      campaignStatus: *id003
runs:
- *id004
