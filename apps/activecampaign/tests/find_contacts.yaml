description: 'Contacts found by a search, the newest first: a short page is the last'
action: find_contacts
credential:
  account: shopexample
  api_key: test-key
input:
  search: Example
exchanges:
- sent:
    method: GET
    url: https://shopexample.api-us1.com/api/3/contacts
    query:
      search: Example
      orders[cdate]: desc
      limit: '100'
    headers:
      api-token: test-key
  answer:
    status: 200
    body:
      contacts:
      - &id001
        id: '113'
        email: ann@example.com
        firstName: Ann
        lastName: Example
        phone: '+15555550100'
        cdate: '2026-11-27T10:00:00-06:00'
        udate: '2026-11-27T10:00:00-06:00'
        orgid: '0'
      meta:
        total: '1'
result:
- *id001
