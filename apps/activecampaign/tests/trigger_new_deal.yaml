        group: '1'
        stage: '2'
        owner: '1'
        cdate: '2026-11-27T10:05:00-06:00'
      - id: '7'
        title: Spring order
        value: '45678'
        currency: usd
        status: '0'
        contact: '113'
        group: '1'
        stage: '2'
        owner: '1'
        cdate: '2026-11-27T10:05:00-06:00'
