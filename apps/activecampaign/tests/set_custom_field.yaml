description: A contact's custom field set
action: set_custom_field
credential:
  account: shopexample
  api_key: test-key
input:
  contact_id: '113'
  field_id: '1'
  value: Gold
exchanges:
- sent:
    method: POST
    url: https://shopexample.api-us1.com/api/3/fieldValues
    headers:
      api-token: test-key
    body:
      fieldValue:
        contact: '113'
        field: '1'
        value: Gold
  answer:
    status: 200
    body:
      contacts:
      - id: '113'
        email: ann@example.com
        firstName: Ann
        lastName: Example
        phone: '+15555550100'
        cdate: '2026-11-27T10:00:00-06:00'
        udate: '2026-11-27T10:00:00-06:00'
        orgid: '0'
      fieldValue: &id001
        id: '9'
        contact: '113'
        field: '1'
        value: Gold
        cdate: '2026-11-27T10:00:00-06:00'
result: *id001
