description: A contact added or updated by email, with a custom field
action: sync_contact
credential:
  account: shopexample
  api_key: test-key
input:
  email: ann@example.com
  first_name: Ann
  last_name: Example
  field_values:
  - field: 1
    value: Gold
exchanges:
- sent:
    method: POST
    url: https://shopexample.api-us1.com/api/3/contact/sync
    headers:
      api-token: test-key
    body:
      contact:
        email: ann@example.com
        firstName: Ann
        lastName: Example
        fieldValues:
        - field: 1
          value: Gold
  answer:
    status: 201
    body:
      fieldValues:
      - contact: '113'
        field: '1'
        value: Gold
        id: '9'
      contact: &id001
        id: '113'
        email: ann@example.com
        firstName: Ann
        lastName: Example
        phone: '+15555550100'
        cdate: '2026-11-27T10:00:00-06:00'
        udate: '2026-11-27T10:00:00-06:00'
        orgid: '0'
result: *id001
