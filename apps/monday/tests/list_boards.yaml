exchanges:
- sent:
    body:
      query: 'query ($workspaces: [ID], $page: Int) { boards(workspace_ids: $workspaces, limit: 100, page: $page, order_by:
        created_at) { id name description state board_kind workspace_id url items_count updated_at } }'
