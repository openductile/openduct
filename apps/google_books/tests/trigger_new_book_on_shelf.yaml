description: "A book put on the To read shelf since the last poll starts a run"
trigger: new_book_on_shelf
credential: { access_token: ya29.test }
input: { shelf: "2" }
seen: { items: [["zyTCAlFPjgYC", ""]] }
exchanges:
  - sent:
      method: GET
      url: https://books.googleapis.com/books/v1/mylibrary/bookshelves/2/volumes
      query: { maxResults: "40" }
    answer:
      body:
        kind: "books#volumes"
        totalItems: 2
        items:
          - { kind: "books#volume", id: zyTCAlFPjgYC, volumeInfo: { title: The Example Garden } }
          - { kind: "books#volume", id: aBcDeFgHiJ0C, volumeInfo: { title: Roses for Everyone } }
runs:
  - { kind: "books#volume", id: aBcDeFgHiJ0C, volumeInfo: { title: Roses for Everyone } }
