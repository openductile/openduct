description: The second page of the whole data set, with the page counts
action: browse_asteroids
credential: { api_key: nasa-test-key }
input: { page: 1 }
exchanges:
  - sent:
      method: GET
      url: https://api.nasa.gov/neo/rest/v1/neo/browse
      query: { api_key: nasa-test-key, page: "1" }
    answer:
      status: 200
      body:
        links: { self: "https://api.nasa.gov/neo/rest/v1/neo/browse?page=1&size=20" }
        page: { size: 20, total_elements: 40000, total_pages: 2000, number: 1 }
        near_earth_objects: [{ neo_reference_id: "3000001", name: (2026 XA1) }]
result:
  links: { self: "https://api.nasa.gov/neo/rest/v1/neo/browse?page=1&size=20" }
  page: { size: 20, total_elements: 40000, total_pages: 2000, number: 1 }
  near_earth_objects: [{ neo_reference_id: "3000001", name: (2026 XA1) }]
