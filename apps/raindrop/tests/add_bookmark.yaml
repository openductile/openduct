    answer:
      body:
        result: true
        item: { _id: 1001, link: "https://supplier.example/catalog", title: Supplier catalog, tags: [supplier, prices], type: link, domain: supplier.example, collection: { $id: 77 }, created: "2026-11-27T09:00:00.000Z" }
