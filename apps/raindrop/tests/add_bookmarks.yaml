description: "Two links saved at once"
action: add_bookmarks
credential: { token: test-token }
input: { items: [{ link: "https://a.example" }, { link: "https://b.example", tags: [read] }] }
exchanges:
  - sent:
      method: POST
      url: https://api.raindrop.io/rest/v1/raindrops
      body: { items: [{ link: "https://a.example" }, { link: "https://b.example", tags: [read] }] }
    answer:
      body:
        result: true
        items:
          - { _id: 1003, link: "https://a.example" }
          - { _id: 1004, link: "https://b.example", tags: [read] }
result:
  - { _id: 1003, link: "https://a.example" }
  - { _id: 1004, link: "https://b.example", tags: [read] }
