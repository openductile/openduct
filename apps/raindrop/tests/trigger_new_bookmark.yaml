description: "A bookmark saved since the last poll starts a run; the page with one seen is the last asked"
trigger: new_bookmark
credential: { token: test-token }
seen: { items: [["1001", ""]] }
exchanges:
  - sent:
      method: GET
      url: https://api.raindrop.io/rest/v1/raindrops/0
      query: { perpage: "50" }
    answer:
      body:
        result: true
        items:
          - { _id: 1002, link: "https://news.example/story", title: A story, created: "2026-11-27T09:30:00.000Z" }
          - { _id: 1001, link: "https://supplier.example/catalog", title: Supplier catalog, created: "2026-11-26T09:00:00.000Z" }
runs:
  - { _id: 1002, link: "https://news.example/story", title: A story, created: "2026-11-27T09:30:00.000Z" }
