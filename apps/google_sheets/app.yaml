app: google_sheets
name: Google Sheets
category: files
description: Rows of a Google Sheets spreadsheet, read, added and changed.
docs: https://developers.google.com/sheets/api/reference/rest
hosts: [sheets.googleapis.com]
base_url: https://sheets.googleapis.com/v4
sign_in:
  - id: google_sheets
    label: Sign in with Google
    oauth2:
      authorize: https://accounts.google.com/o/oauth2/v2/auth
      token: https://oauth2.googleapis.com/token
      scopes: [https://www.googleapis.com/auth/spreadsheets]
      extra: { access_type: offline, prompt: consent }
    headers:
      Authorization: "Bearer {{ credential.access_token }}"
error: value.error.message
actions:
  add_row:
    label: Add a row
    write: true
    method: POST
    path: "/spreadsheets/{{ input.spreadsheet_id }}/values/{{ input.sheet }}:append"
    inputs:
      - { name: spreadsheet_id, label: "The spreadsheet's id (in its address)", required: true }
      - { name: sheet, label: "The sheet's name, such as Sheet1", required: true }
      - { name: values, label: "The row's values, in order (as JSON)", required: true, kind: list }
    query: { valueInputOption: USER_ENTERED }
    send: { values: "{{ [input.values] }}" }
  read_rows:
    label: Read rows
    method: GET
    path: "/spreadsheets/{{ input.spreadsheet_id }}/values/{{ input.range }}"
    inputs:
      - { name: spreadsheet_id, label: "The spreadsheet's id (in its address)", required: true }
      - { name: range, label: "Which, such as Sheet1!A1:F100, or Sheet1", required: true }
    result: "value.values == null ? [] : value.values"
  set_rows:
    label: Write over rows
    write: true
    method: PUT
    path: "/spreadsheets/{{ input.spreadsheet_id }}/values/{{ input.range }}"
    inputs:
      - { name: spreadsheet_id, label: "The spreadsheet's id (in its address)", required: true }
      - { name: range, label: "Where, such as Sheet1!A2:C2", required: true }
      - { name: rows, label: "The rows: a list of lists (as JSON)", required: true, kind: list }
    query: { valueInputOption: USER_ENTERED }
    send: { values: "{{ input.rows }}" }
triggers:
  new_row:
    label: A new row
    description: >-
      Each row added under the header row, asked for every few minutes: its columns by the header's names, and its
      row_number.
    inputs:
      - { name: spreadsheet_id, label: "The spreadsheet's id (in its address)", required: true }
      - { name: sheet, label: "The sheet's name, such as Sheet1", required: true }
    poll:
      method: GET
      path: "/spreadsheets/{{ input.spreadsheet_id }}/values/{{ input.sheet }}"
      query: { majorDimension: ROWS }
      items: "value.values == null ? [] : value.values"
      # The first row names the columns: each row after it is a record of them, with its row_number.
      header_row: true
      id: string(item.row_number)
  new_or_updated_row:
    label: A new or changed row
    description: >-
      Each row added, or changed since the poll before. A row is known by its number: rows put in above it, or taken
      out, make the rows below it look changed.
    inputs:
      - { name: spreadsheet_id, label: "The spreadsheet's id (in its address)", required: true }
      - { name: sheet, label: "The sheet's name, such as Sheet1", required: true }
    poll:
      method: GET
      path: "/spreadsheets/{{ input.spreadsheet_id }}/values/{{ input.sheet }}"
      query: { majorDimension: ROWS }
      items: "value.values == null ? [] : value.values"
      # The first row names the columns: each row after it is a record of them, with its row_number.
      header_row: true
      id: string(item.row_number)
      version: item
