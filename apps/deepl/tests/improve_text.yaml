description: A text rewritten in a business style
action: improve_text
credential: { api_key: 0f6a2c1e-5b7d-4e2a-9c3f-1a2b3c4d5e6f }
input: { text: "we got your mail and will answer you soon", target_lang: en-US, writing_style: business }
exchanges:
  - sent:
      method: POST
      url: "https://api.deepl.com/v2/write/rephrase"
      headers: { authorization: DeepL-Auth-Key 0f6a2c1e-5b7d-4e2a-9c3f-1a2b3c4d5e6f }
      body: { text: ["we got your mail and will answer you soon"], target_lang: en-US, writing_style: business }
    answer:
      status: 200
      body:
        improvements:
          - { detected_source_language: en, target_language: en-US, text: "We have received your email and will respond shortly." }
result:
  improvements:
    - { detected_source_language: en, target_language: en-US, text: "We have received your email and will respond shortly." }
