      workspace_id: text
      content_id: text
      title: text
      description: text
      body: text
      body_markdown: text
      author_id: number
      state: text
      created_at: number
      updated_at: number
      has_unpublished_changes: boolean
      draft_updated_at: number
      url: text
      parent_ids: list
