# Checked as made. Change what you like, then run `openduct app check` and `openduct app test` again.
app: intercom
name: Intercom
category: support
description: "The intercom API reference."
docs: "https://developers.intercom.com"
hosts: [api.intercom.io]
base_url: "https://api.intercom.io"
sign_in:
  - id: intercom
    label: "An access token"
    fields: [{ name: token, label: "The access token (or API key) it sends as a bearer token", secret: true }]
    headers: { Authorization: "Bearer {{ credential.token }}" }
actions:
  list_content_import_sources:
    label: "List content import sources"
    description: "You can retrieve a list of all content import sources for a workspace."
    method: GET
    path: "/ai/content_import_sources"
    inputs:
      - { name: intercom_version, label: "Intercom version" }
      - { name: page, label: "The page of results to fetch", kind: number }
    query: { page: "{{ input.page }}", per_page: "100" }
    headers: { Intercom-Version: "{{ input.intercom_version }}" }
    items: value.data
    next: "value.pages.next == null || value.pages.next == '' ? null : (value.pages.next.startsWith('http') ? value.pages.next : 'https://api.intercom.io' + value.pages.next)"
    output:
      type: text
      id: number
      last_synced_at: number
      sync_behavior: text
      status: text
      url: text
      created_at: number
      updated_at: number
      audience_ids: list
  list_articles:
    label: "List all articles"
    description: "You can fetch a list of all articles by making a GET request to https://api.intercom.io/articles."
    method: GET
    path: "/articles"
    inputs:
      - { name: intercom_version, label: "Intercom version" }
      - { name: page, label: "The page of results to fetch", kind: number }
    query: { page: "{{ input.page }}", per_page: "100" }
    headers: { Intercom-Version: "{{ input.intercom_version }}" }
    items: value.data
    next: "value.pages.next == null || value.pages.next == '' ? null : (value.pages.next.startsWith('http') ? value.pages.next : 'https://api.intercom.io' + value.pages.next)"
    output:
      type: text
      id: text
      workspace_id: text
      content_id: text
      title: text
      description: text
      body: text
      body_markdown: text
      author_id: number
      state: text
      created_at: number
      updated_at: number
      has_unpublished_changes: boolean
      draft_updated_at: number
      url: text
      parent_ids: list
      audience_ids: list
      ai_chatbot_availability: boolean
      ai_copilot_availability: boolean
      ai_sales_agent_availability: boolean
      created_by_id: number
      updated_by_id: number
      exclude_from_article_suggestions: boolean
      help_center_audience: text
      scheduled_publish_at: number
      scheduled_unpublish_at: number
      default_locale: text
      translated_content: record
      tags: record
      folder_id: number
  list_scroll:
    label: "Scroll over all companies"
    description: "The list all companies functionality does not work well for huge datasets, and can result in errors and performance problems when paging deeply."
    method: GET
    path: "/companies/scroll"
    inputs:
      - { name: intercom_version, label: "Intercom version" }
      - { name: scroll_param, label: "The scroll_param from the previous response" }
    query: { scroll_param: "{{ input.scroll_param }}" }
    headers: { Intercom-Version: "{{ input.intercom_version }}" }
    items: value.data
    output:
      type: text
      id: text
      name: text
      app_id: text
      plan: record
      company_id: text
      remote_created_at: number
      created_at: number
      updated_at: number
      last_request_at: number
      size: number
      website: text
      industry: text
      monthly_spend: number
      session_count: number
      user_count: number
      custom_attributes: record
      tags: record
      segments: record
      notes: record
  list_deleted:
    label: "List deleted contacts"
    description: "Fetch a paginated list of the contacts in your workspace that are no longer active, so you can recover ones whose id, email, or external_id you no longer have and then permanently delete them."
    method: GET
    path: "/contacts/deleted"
    inputs:
      - { name: intercom_version, label: "Intercom version" }
      - name: escape_identity
        label: "By default, email values in the response are HTML-escaped (for example, & is…"
        kind: boolean
        description: "By default, email values in the response are HTML-escaped (for example, & is returned as &amp;)."
    query: { escape_identity: "{{ input.escape_identity }}", per_page: "100" }
    headers: { Intercom-Version: "{{ input.intercom_version }}" }
    items: value.data
    next: "size(value.data) < 100 ? null : {'page': (page == null ? 1 : int(page['page'])) + 1}"
    output:
      type: text
      id: text
      external_id: text
      email: text
      role: text
      status: text
      merged_into_id: text
      updated_at: number
  list_conversations:
    label: "List all conversations"
    description: "You can fetch a list of all conversations."
    method: GET
    path: "/conversations"
    inputs:
      - { name: intercom_version, label: "Intercom version" }
      - name: include_monitors
        label: "If set to true, the response will include a monitor_evaluations array on each…"
        kind: boolean
        description: "If set to true, the response will include a monitor_evaluations array on each conversation with the latest QA monitor evaluation for each monitor that has evaluated it."
      - name: include_scorecards
        label: "If set to true, the response will include a scorecards array on each…"
        kind: boolean
        description: "If set to true, the response will include a scorecards array on each conversation with any QA scorecard results."
    query:
      include_monitors: "{{ input.include_monitors }}"
      include_scorecards: "{{ input.include_scorecards }}"
      per_page: "100"
    headers: { Intercom-Version: "{{ input.intercom_version }}" }
    items: value.conversations
    next: "value.pages.next.starting_after == null || value.pages.next.starting_after == '' ? null : {'starting_after': value.pages.next.starting_after}"
    output:
      type: text
      id: text
      title: text
      created_at: number
      updated_at: number
      waiting_since: number
      snoozed_until: number
      open: boolean
      state: text
      read: boolean
      priority: text
      admin_assignee_id: number
      team_assignee_id: number
      company: record
      tags: record
      conversation_rating: record
      source: record
      contacts: record
      teammates: record
      custom_attributes: record
      first_contact_reply: record
      sla_applied: record
      statistics: record
      linked_objects: record
      ai_agent_participated: boolean
      ai_agent: record
      sales_agent_participated: boolean
      sales_agent: record
      channel: record
      topics: record
      ticket: record
      external_references: list
      monitor_evaluations: list
      scorecards: list
  create_content_import_source:
    label: "Create a content import source"
    description: "You can create a new content import source by sending a POST request to this endpoint."
    write: true
    method: POST
    path: "/ai/content_import_sources"
    inputs:
      - { name: intercom_version, label: "Intercom version" }
      - { name: status, label: "The status of the content import source" }
      - { name: url, label: "The URL of the content import source", required: true }
      - name: audience_ids
        label: "The unique identifiers for the audiences to associate with this content import…"
        kind: number
    headers: { Intercom-Version: "{{ input.intercom_version }}" }
    send:
      sync_behavior: api
      status: "{{ input.status }}"
      url: "{{ input.url }}"
      audience_ids: "{{ input.audience_ids }}"
    output:
      type: text
      id: number
      last_synced_at: number
      sync_behavior: text
      status: text
      url: text
      created_at: number
      updated_at: number
