      - { name: parent_id, label: "The id of the article's parent collection or section", kind: number }
      - { name: parent_ids, label: "The ids of the parent collections to place this article in", kind: list }
      - { name: locale, label: "The locale of the article's default content, for example en" }
      - { name: translated_content, label: "The Translated Content of an Article", kind: record }
