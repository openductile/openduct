app: woocommerce
name: WooCommerce
category: commerce
description: Orders of a WooCommerce store, on your own site.
docs: https://woocommerce.github.io/woocommerce-rest-api-docs/
base_url_field: store_url
sign_in:
  - id: woocommerce
    label: A REST API key
    fields:
      - { name: store_url, label: "The store's address, such as https://shop.example.com" }
      - { name: consumer_key, label: "Consumer key (ck_...)" }
      - { name: consumer_secret, label: "Consumer secret (cs_...)", secret: true }
      - { name: webhook_secret, label: "A webhook's secret, for one added in WooCommerce by hand", secret: true, optional: true }
    basic: { username: "{{ credential.consumer_key }}", password: "{{ credential.consumer_secret }}" }
error: value.message
actions:
  list_orders:
    label: List orders
    method: GET
    path: /wp-json/wc/v3/orders
    inputs:
      - { name: status, label: "Which: pending, processing, on-hold, completed, cancelled, refunded or any" }
      - { name: after, label: "Made since (ISO 8601, such as 2026-11-01T00:00:00)" }
    query: { status: "{{ input.status }}", after: "{{ input.after }}", per_page: "100" }
    items: value
    # WooCommerce says nothing of a next page in its answer: a full page means there may be one.
    next: "size(value) < 100 ? null : {'page': (page == null ? 1 : int(page.page)) + 1}"
  get_order:
    label: Look up an order
    method: GET
    path: "/wp-json/wc/v3/orders/{{ input.order_id }}"
    inputs:
      - { name: order_id, label: "The order's number", required: true }
  set_order_status:
    label: Change an order's status
    write: true
    method: PUT
    path: "/wp-json/wc/v3/orders/{{ input.order_id }}"
    inputs:
      - { name: order_id, label: "The order's number", required: true }
      - { name: status, label: "Its new status, such as completed", required: true }
    send: { status: "{{ input.status }}" }
triggers:
  new_order:
    label: A new order
    description: >-
      Each order placed in the store, as WooCommerce sends it, signed. Turning the workflow on adds a webhook to the
      store, and turning it off deletes it.
    webhook:
      signature: { header: x-wc-webhook-signature, encoding: base64 }
      secret: webhook_secret
      # WooCommerce checks a new webhook's address with an unsigned ping first.
      ping: has(value.webhook_id)
      id: "headers['x-wc-webhook-delivery-id']"
      only: "headers['x-wc-webhook-topic'] == 'order.created'"
      register:
        - method: POST
          path: /wp-json/wc/v3/webhooks
          send: { name: "OpenDuct workflow {{ input.workflow }}", topic: order.created, delivery_url: "{{ input.address }}", secret: "{{ input.secret }}" }
      keep: { webhook_secret: input.secret, webhook_id: string(value.id) }
      unregister:
        - { method: DELETE, path: "/wp-json/wc/v3/webhooks/{{ input.registered.webhook_id }}", query: { force: "true" } }
