description: A room's topic changed
action: set_room_topic
credential: { homeserver: "https://matrix.example.org", token: syt_test_token }
input: { room_id: "!abc123:example.org", topic: Delivered on 27 November }
exchanges:
  - sent:
      method: PUT
      url: "https://matrix.example.org/_matrix/client/v3/rooms/!abc123:example.org/state/m.room.topic/"
      body: { topic: Delivered on 27 November }
    answer: { status: 200, body: { event_id: "$ev9" } }
result: { event_id: "$ev9" }
