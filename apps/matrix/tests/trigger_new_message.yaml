description: The newest messages asked for; the two not seen before run, oldest first
trigger: new_message
credential: { homeserver: "https://matrix.example.org", token: syt_test_token }
input: { room_id: "!abc123:example.org" }
seen: { items: [["$ev1", ""]] }
exchanges:
  - sent:
      method: GET
      url: "https://matrix.example.org/_matrix/client/v3/rooms/!abc123:example.org/messages"
      query: { dir: b, limit: "50", filter: '{"types":["m.room.message"]}' }
      headers: { authorization: Bearer syt_test_token }
    answer: { status: 200, body: { chunk: [{ event_id: "$ev3", type: m.room.message, sender: "@cy:example.org", content: { msgtype: m.text, body: Is it insured? }, origin_server_ts: 1764230520000, room_id: "!abc123:example.org" }, { event_id: "$ev2", type: m.room.message, sender: "@bo:example.org", content: { msgtype: m.text, body: Thanks! }, origin_server_ts: 1764230460000, room_id: "!abc123:example.org" }, { event_id: "$ev1", type: m.room.message, sender: "@ann:example.org", content: { msgtype: m.text, body: Order A-1042 shipped }, origin_server_ts: 1764230400000, room_id: "!abc123:example.org" }], start: t50-1, end: t44-1 } }
runs:
  - { event_id: "$ev2", type: m.room.message, sender: "@bo:example.org", content: { msgtype: m.text, body: Thanks! }, origin_server_ts: 1764230460000, room_id: "!abc123:example.org" }
  - { event_id: "$ev3", type: m.room.message, sender: "@cy:example.org", content: { msgtype: m.text, body: Is it insured? }, origin_server_ts: 1764230520000, room_id: "!abc123:example.org" }
ids: ["$ev2", "$ev3"]
