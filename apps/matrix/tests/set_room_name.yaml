description: A room renamed - the name is a state event with an empty key
action: set_room_name
credential: { homeserver: "https://matrix.example.org", token: syt_test_token }
input: { room_id: "!abc123:example.org", name: Order A-1042 (shipped) }
exchanges:
  - sent:
      method: PUT
      url: "https://matrix.example.org/_matrix/client/v3/rooms/!abc123:example.org/state/m.room.name/"
      body: { name: Order A-1042 (shipped) }
    answer: { status: 200, body: { event_id: "$ev8" } }
result: { event_id: "$ev8" }
