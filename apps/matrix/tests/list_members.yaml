description: A room's members by user id
action: list_members
credential: { homeserver: "https://matrix.example.org", token: syt_test_token }
input: { room_id: "!abc123:example.org" }
exchanges:
  - sent:
      method: GET
      url: "https://matrix.example.org/_matrix/client/v3/rooms/!abc123:example.org/joined_members"
    answer: { status: 200, body: { joined: { "@ann:example.org": { display_name: Ann, avatar_url: "mxc://example.org/a1" } } } }
result: { joined: { "@ann:example.org": { display_name: Ann, avatar_url: "mxc://example.org/a1" } } }
