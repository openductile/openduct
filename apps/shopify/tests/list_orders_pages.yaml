      headers: { link: '<https://acme.myshopify.com/admin/api/2025-01/orders.json?limit=250&page_info=eyJmaXJzdF9pZCI6M30>; rel="previous"' }
      body: { orders: [{ id: 3 }] }
result: [{ id: 1 }, { id: 2 }, { id: 3 }]
