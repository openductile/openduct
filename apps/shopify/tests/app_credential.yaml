description: With an app's client ID and secret, the token the store gave is sent as with an access token
action: get_order
sign_in: shopify_app
credential: { shop: acme, client_id: cid, client_secret: cs, access_token: shpat_day, expires_at: "4102444800" }
input: { order_id: "450789469" }
exchanges:
  - sent: { url: https://acme.myshopify.com/admin/api/2025-01/orders/450789469.json, headers: { x-shopify-access-token: shpat_day } }
    answer: { body: { order: { id: 450789469, name: "#1001" } } }
result: { id: 450789469, name: "#1001" }
