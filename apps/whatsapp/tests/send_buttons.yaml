description: Reply buttons, from plain titles and an {id, title} record
action: send_buttons
credential: { access_token: EAAG1, phone_number_id: "1234", api_version: v21.0 }
input: { to: "16505551234", text: "Your table for two at 8pm?", buttons: [Confirm, { id: change, title: Change time }], footer: Riverside Bistro }
exchanges:
  - sent:
      method: POST
      url: https://graph.facebook.com/v21.0/1234/messages
      body:
        messaging_product: whatsapp
        recipient_type: individual
        to: "16505551234"
        type: interactive
        interactive:
          type: button
          body: { text: "Your table for two at 8pm?" }
          footer: { text: Riverside Bistro }
          action: { buttons: [{ type: reply, reply: { id: Confirm, title: Confirm } }, { type: reply, reply: { id: change, title: Change time } }] }
    answer: { body: { messaging_product: whatsapp, messages: [{ id: wamid.B1 }] } }
result: { messaging_product: whatsapp, messages: [{ id: wamid.B1 }] }
