description: A comment on a case
action: comment_on_case
credential:
  url: https://thehive.example.com
  api_key: test-key
input:
  case_id: ~8192
  message: Sender blocked.
exchanges:
- sent:
    method: POST
    url: https://thehive.example.com/api/v1/case/~8192/comment
    headers:
      authorization: Bearer test-key
    body:
      message: Sender blocked.
  answer:
    status: 201
    body: &id001
      _id: ~24576
      _type: Comment
      createdBy: analyst@example.com
      createdAt: 1795161700000
      message: Sender blocked.
      isEdited: false
result: *id001
