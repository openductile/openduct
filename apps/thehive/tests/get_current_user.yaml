description: Who the key acts as
action: get_current_user
credential:
  url: https://thehive.example.com
  api_key: test-key
exchanges:
- sent:
    method: GET
    url: https://thehive.example.com/api/v1/user/current
    headers:
      authorization: Bearer test-key
  answer:
    status: 200
    body:
      _id: ~3
      login: soc-bot@example.com
      name: SOC bot
      email: soc-bot@example.com
      profile: analyst
      organisation: Sample Org
      permissions:
      - manageAlert/create
      - manageCase/create
      locked: false
result:
  _id: ~3
  login: soc-bot@example.com
  name: SOC bot
  email: soc-bot@example.com
  profile: analyst
  organisation: Sample Org
  permissions:
  - manageAlert/create
  - manageCase/create
  locked: false
