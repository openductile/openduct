description: A case made of an alert, from a template
action: create_case_from_alert
credential:
  url: https://thehive.example.com
  api_key: test-key
input:
  alert_id: ~4096
  case_template: Phishing
exchanges:
- sent:
    method: POST
    url: https://thehive.example.com/api/v1/alert/~4096/case
    headers:
      authorization: Bearer test-key
    body:
      caseTemplate: Phishing
  answer:
    status: 201
    body: &id001
      _id: ~8192
      _type: Case
      _createdBy: analyst@example.com
      _createdAt: 1795161600000
      _updatedAt: 1795165200000
      number: 42
      title: Password reset email reported
      description: Reported phishing email.
      severity: 2
      severityLabel: MEDIUM
      startDate: 1795161600000
      endDate: null
      tags:
      - phishing
      flag: false
      tlp: 2
      pap: 2
      status: New
      stage: New
      summary: null
      impactStatus: null
      assignee: analyst@example.com
      customFields: []
result: *id001
