      severity: 2
      severityLabel: MEDIUM
      date: 1795161600000
      tags:
      - phishing
      tlp: 2
      tlpLabel: AMBER
      pap: 2
      papLabel: AMBER
      follow: true
      customFields: []
      observableCount: 1
