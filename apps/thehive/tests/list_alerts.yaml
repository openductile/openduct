description: 'The newest alerts of a status: a query of TheHive''s'
action: list_alerts
credential:
  url: https://thehive.example.com
  api_key: test-key
input:
  status: New
  limit: 2
exchanges:
- sent:
    method: POST
    url: https://thehive.example.com/api/v1/query
    headers:
      authorization: Bearer test-key
    body:
      query:
      - _name: listAlert
      - _name: filter
        _eq:
          _field: status
          _value: New
      - _name: sort
        _fields:
        - _createdAt: desc
      - _name: page
        from: 0
        to: 2
  answer:
    status: 200
    body:
    - &id001
      _id: ~4160
      _type: Alert
      _createdBy: soc-bot@example.com
      _createdAt: 1795161600000
