description: A case deleted
action: delete_case
credential:
  url: https://thehive.example.com
  api_key: test-key
input:
  case_id: ~8256
exchanges:
- sent:
    method: DELETE
    url: https://thehive.example.com/api/v1/case/~8256
    headers:
      authorization: Bearer test-key
  answer:
    status: 204
result:
  deleted: true
