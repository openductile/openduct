description: A week of a calendar - an all-day event and a timed one
action: calendar_events
credential: { url: "http://home.example:8123", token: ha-test-token }
input: { calendar: calendar.shop, start: "2026-11-27T00:00:00Z", end: "2026-12-04T00:00:00Z" }
exchanges:
  - sent:
      method: GET
      url: "http://home.example:8123/api/calendars/calendar.shop"
      query: { start: "2026-11-27T00:00:00Z", end: "2026-12-04T00:00:00Z" }
    answer:
      status: 200
      body:
        - { summary: Stocktake, start: { date: "2026-11-30" }, end: { date: "2026-12-01" } }
        - { summary: Delivery, start: { dateTime: "2026-12-02T09:00:00+01:00" }, end: { dateTime: "2026-12-02T10:00:00+01:00" }, location: Back door }
result:
  - { summary: Stocktake, start: { date: "2026-11-30" }, end: { date: "2026-12-01" } }
  - { summary: Delivery, start: { dateTime: "2026-12-02T09:00:00+01:00" }, end: { dateTime: "2026-12-02T10:00:00+01:00" }, location: Back door }
