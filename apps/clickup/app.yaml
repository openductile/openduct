triggers:
  task_event:
    label: A task made or changed
    description: >-
      Each task made (or changed, moved, commented on, as chosen) in the workspace, or in one space, folder or list of
      it, as ClickUp sends it, signed. Turning the workflow on asks ClickUp to send them, and turning it off stops it.
    inputs:
      - { name: team_id, label: The workspace's id, required: true }
      - name: events
        label: >-
          Which, with commas: taskCreated (the default), taskUpdated, taskStatusUpdated, taskAssigneeUpdated,
          taskCommentPosted, taskMoved, taskDeleted ...
      - { name: space_id, label: Only in this space (its id) }
      - { name: folder_id, label: Only in this folder (its id) }
      - { name: list_id, label: Only in this list (its id) }
    webhook:
      signature: { header: x-signature, encoding: hex }
      secret: webhook_secret
      id: >-
        value.webhook_id + '#' + value.event + '#' + value.task_id + '#' + (has(value.history_items) &&
        size(value.history_items) > 0 ? value.history_items[0].id : '')
      only: >-
        (input.events == null ? ['taskCreated'] : input.events.split(',').map(e, e.trim())).exists(e, e ==
        value.event)
      event: >-
        {'event': value.event, 'task_id': value.task_id, 'changes': has(value.history_items) ? value.history_items :
        []}
      register:
        - method: POST
          path: "/v2/team/{{ input.team_id }}/webhook"
          send:
            endpoint: "{{ input.address }}"
            events: "{{ input.events == null ? ['taskCreated'] : input.events.split(',').map(e, e.trim()) }}"
            space_id: "{{ input.space_id == null ? null : int(input.space_id) }}"
            folder_id: "{{ input.folder_id == null ? null : int(input.folder_id) }}"
            list_id: "{{ input.list_id == null ? null : int(input.list_id) }}"
      keep: { webhook_secret: value.webhook.secret, webhook_id: value.id }
      unregister:
        - { method: DELETE, path: "/v2/webhook/{{ input.registered.webhook_id }}" }
