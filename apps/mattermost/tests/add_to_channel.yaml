description: Two people added to a channel
action: add_to_channel
credential: { server_url: "https://chat.example.com", token: testmmtoken0000000000000000 }
input: { channel_id: c1aaaaaaaaaaaaaaaaaaaaaaaa, user_ids: [u1aaaaaaaaaaaaaaaaaaaaaaaa, u2aaaaaaaaaaaaaaaaaaaaaaaa] }
exchanges:
  - sent:
      method: POST
      url: https://chat.example.com/api/v4/channels/c1aaaaaaaaaaaaaaaaaaaaaaaa/members
      headers: { authorization: Bearer testmmtoken0000000000000000 }
      body: { user_ids: [u1aaaaaaaaaaaaaaaaaaaaaaaa, u2aaaaaaaaaaaaaaaaaaaaaaaa] }
    answer: { status: 201, body: { channel_id: c1aaaaaaaaaaaaaaaaaaaaaaaa, user_id: u2aaaaaaaaaaaaaaaaaaaaaaaa, roles: channel_user } }
result: { channel_id: c1aaaaaaaaaaaaaaaaaaaaaaaa, user_id: u2aaaaaaaaaaaaaaaaaaaaaaaa, roles: channel_user }
