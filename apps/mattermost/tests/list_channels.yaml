description: A team's public channels
action: list_channels
credential: { server_url: "https://chat.example.com", token: testmmtoken0000000000000000 }
input: { team_id: t1aaaaaaaaaaaaaaaaaaaaaaaa }
exchanges:
  - sent:
      method: GET
      url: https://chat.example.com/api/v4/teams/t1aaaaaaaaaaaaaaaaaaaaaaaa/channels
      headers: { authorization: Bearer testmmtoken0000000000000000 }
      query: { per_page: "200" }
    answer: { body: [{ id: c1aaaaaaaaaaaaaaaaaaaaaaaa, team_id: t1aaaaaaaaaaaaaaaaaaaaaaaa, type: O, name: orders, display_name: Orders, purpose: Order updates, header: "" }] }
result: [{ id: c1aaaaaaaaaaaaaaaaaaaaaaaa, team_id: t1aaaaaaaaaaaaaaaaaaaaaaaa, type: O, name: orders, display_name: Orders, purpose: Order updates, header: "" }]
