description: Every page of formSubmissions, followed by the pagination Webflow gives
action: list_form_submissions
credential: { token: test-token }
input: { site_id: site_1, element_id: el_1 }
exchanges:
  - sent:
      method: GET
      url: "https://api.webflow.com/v2/sites/site_1/form_submissions"
      query: { limit: "100", elementId: el_1 }
      headers: { authorization: "Bearer test-token" }
    answer: { status: 200, body: { formSubmissions: [{ id: sub_1, displayName: Contact Us, dateSubmitted: "2026-11-26T10:00:00Z", formResponse: { Name: Ann Lee, Email: ann@example.com } }], pagination: { limit: 1, offset: 0, total: 2 } } }
  - sent:
      method: GET
      url: "https://api.webflow.com/v2/sites/site_1/form_submissions"
      query: { limit: "100", elementId: el_1, offset: "1" }
    answer: { status: 200, body: { formSubmissions: [{ id: sub_2, displayName: Contact Us, dateSubmitted: "2026-11-27T09:30:00Z", formResponse: { Name: Bo Chen, Email: bo@example.com } }], pagination: { limit: 1, offset: 1, total: 2 } } }
result: [{ id: sub_1, displayName: Contact Us, dateSubmitted: "2026-11-26T10:00:00Z", formResponse: { Name: Ann Lee, Email: ann@example.com } }, { id: sub_2, displayName: Contact Us, dateSubmitted: "2026-11-27T09:30:00Z", formResponse: { Name: Bo Chen, Email: bo@example.com } }]
