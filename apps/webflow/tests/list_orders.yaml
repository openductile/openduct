description: Every page of orders, followed by the pagination Webflow gives
action: list_orders
credential: { token: test-token }
input: { site_id: site_1, status: unfulfilled }
exchanges:
  - sent:
      method: GET
      url: "https://api.webflow.com/v2/sites/site_1/orders"
      query: { limit: "100", status: unfulfilled }
      headers: { authorization: "Bearer test-token" }
    answer: { status: 200, body: { orders: [{ orderId: "5e8d5c", status: unfulfilled, customerInfo: { fullName: Ann Lee, email: ann@example.com } }], pagination: { limit: 1, offset: 0, total: 2 } } }
  - sent:
      method: GET
      url: "https://api.webflow.com/v2/sites/site_1/orders"
      query: { limit: "100", status: unfulfilled, offset: "1" }
    answer: { status: 200, body: { orders: [{ orderId: "6f9e6d", status: unfulfilled, customerInfo: { fullName: Bo Chen, email: bo@example.com } }], pagination: { limit: 1, offset: 1, total: 2 } } }
result: [{ orderId: "5e8d5c", status: unfulfilled, customerInfo: { fullName: Ann Lee, email: ann@example.com } }, { orderId: "6f9e6d", status: unfulfilled, customerInfo: { fullName: Bo Chen, email: bo@example.com } }]
