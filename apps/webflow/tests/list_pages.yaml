description: Every page of pages, followed by the pagination Webflow gives
action: list_pages
credential: { token: test-token }
input: { site_id: site_1 }
exchanges:
  - sent:
      method: GET
      url: "https://api.webflow.com/v2/sites/site_1/pages"
      query: { limit: "100" }
      headers: { authorization: "Bearer test-token" }
    answer: { status: 200, body: { pages: [{ id: pg_1, title: Home, slug: index }], pagination: { limit: 1, offset: 0, total: 2 } } }
  - sent:
      method: GET
      url: "https://api.webflow.com/v2/sites/site_1/pages"
      query: { limit: "100", offset: "1" }
    answer: { status: 200, body: { pages: [{ id: pg_2, title: Contact, slug: contact }], pagination: { limit: 1, offset: 1, total: 2 } } }
result: [{ id: pg_1, title: Home, slug: index }, { id: pg_2, title: Contact, slug: contact }]
