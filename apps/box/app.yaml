      - { name: direction, label: "The direction to sort results in" }
      - { name: sort, label: "Defines the second attribute by which items are sorted" }
    query:
      offset: "{{ input.offset }}"
      usemarker: "{{ input.usemarker }}"
      direction: "{{ input.direction }}"
      sort: "{{ input.sort }}"
      limit: "100"
    items: value.entries
    next: "value.next_marker == null || value.next_marker == '' ? null : {'marker': value.next_marker}"
