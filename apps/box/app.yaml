  get_content:
    label: "Download file"
    description: "Returns the contents of a file in binary format."
    method: GET
    path: "/files/{{ input.file_id }}/content"
    inputs:
      - { name: file_id, label: "The unique identifier that represents a file", required: true }
      - { name: range, label: "The byte range of the content to download" }
      - { name: boxapi, label: "The URL, and optional password, for the shared link of this item" }
      - { name: version, label: "The file version to download" }
      - name: access_token
        label: "An optional access token that can be used to pre-authenticate this request,…"
        description: "An optional access token that can be used to pre-authenticate this request, which means that a download link can be shared with a browser or a third party service without them needing to know how to handle the authentication."
    query: { version: "{{ input.version }}", access_token: "{{ input.access_token }}" }
    headers: { range: "{{ input.range }}", boxapi: "{{ input.boxapi }}" }
  get_folder_trash:
    label: "Get trashed folder"
    description: "Retrieves a folder that has been moved to the trash."
    method: GET
    path: "/folders/{{ input.folder_id }}/trash"
    inputs: [{ name: folder_id, label: "The unique identifier that represent a folder", required: true }]
    output:
      id: text
      etag: text
      type: text
      sequence_id: text
      name: text
      created_at: text
      modified_at: text
      description: text
      size: number
      path_collection: record
      created_by: record
      modified_by: record
      trashed_at: text
      purged_at: text
      content_created_at: text
      content_modified_at: text
      owned_by: record
      shared_link: text
      folder_upload_email: text
      parent: record
      item_status: text
  update_metadata_taxonomy:
    label: "Update metadata taxonomy"
    description: "Updates an existing metadata taxonomy."
    write: true
    method: PATCH
    path: "/metadata_taxonomies/{{ input['namespace'] }}/{{ input.taxonomy_key }}"
    inputs:
      - { name: namespace, label: "The namespace of the metadata taxonomy", required: true }
      - { name: taxonomy_key, label: "The key of the metadata taxonomy", required: true }
      - { name: display_name, label: "The display name of the taxonomy" }
    send: { displayName: "{{ input.display_name }}" }
    output: { id: text, key: text, displayName: text, namespace: text, levels: list }
  schema_metadata_template:
    label: "Create metadata template"
    description: "Creates a new metadata template that can be applied to files and folders."
    write: true
    method: POST
    path: "/metadata_templates/schema"
    inputs:
      - { name: scope, label: "The scope of the metadata template to create", required: true }
      - { name: template_key, label: "A unique identifier for the template" }
      - { name: display_name, label: "The display name of the template", required: true }
      - name: hidden
        label: "Defines if this template is visible in the Box web app UI, or if it is purely…"
        kind: boolean
        description: "Defines if this template is visible in the Box web app UI, or if it is purely intended for usage through the API."
      - name: fields
        label: "An ordered list of template fields which are part of the template"
        kind: list
      - name: copy_instance_on_item_copy
        label: "Whether or not to copy any metadata attached to a file or folder when it is…"
        kind: boolean
    send:
      scope: "{{ input.scope }}"
      templateKey: "{{ input.template_key }}"
      displayName: "{{ input.display_name }}"
      hidden: "{{ input.hidden }}"
      fields: "{{ input.fields }}"
      copyInstanceOnItemCopy: "{{ input.copy_instance_on_item_copy }}"
    output:
      id: text
      type: text
      scope: text
      templateKey: text
      displayName: text
      hidden: boolean
      fields: list
      copyInstanceOnItemCopy: boolean
  levels_metadata_taxonomy:
    label: "Create metadata taxonomy levels"
    description: "Creates new metadata taxonomy levels."
    write: true
    method: POST
    path: "/metadata_taxonomies/{{ input['namespace'] }}/{{ input.taxonomy_key }}/levels"
    inputs:
      - { name: namespace, label: "The namespace of the metadata taxonomy", required: true }
      - { name: taxonomy_key, label: "The key of the metadata taxonomy", required: true }
      - { name: body, label: "The whole body of the request, as the API reference describes it", kind: list }
    send: "{{ input.body }}"
    output: { entries: list }
