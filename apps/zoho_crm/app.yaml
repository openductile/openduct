app: zoho_crm
name: Zoho CRM
category: crm
description: Leads, contacts, accounts, deals and every other module of Zoho CRM - found, added, changed, converted and noted.
docs: https://www.zoho.com/crm/developer/docs/api/v8/
hosts:
  - www.zohoapis.com
  - www.zohoapis.eu
  - www.zohoapis.in
  - www.zohoapis.com.au
  - www.zohoapis.jp
  - www.zohoapis.ca
  - www.zohoapis.sa
  - www.zohoapis.com.cn
base_url: https://www.zohoapis.com/crm/v8
# One sign-in for each of Zoho's data centres: an account is held in one, and its tokens are asked for there.
sign_in:
  - id: zoho_crm
    label: Sign in with Zoho (United States, zoho.com)
    oauth2:
      authorize: https://accounts.zoho.com/oauth/v2/auth
      token: https://accounts.zoho.com/oauth/v2/token
      scopes: ["ZohoCRM.modules.ALL,ZohoCRM.coql.READ,ZohoCRM.settings.fields.READ"]
      extra: { access_type: offline, prompt: consent }
    headers: { Authorization: "Zoho-oauthtoken {{ credential.access_token }}" }
