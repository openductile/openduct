triggers:
  new_issue:
    label: A new issue
    description: Each issue Sentry finds for the first time in an organization, the newest asked for every few minutes.
    inputs:
      - { name: organization_id_or_slug, label: "The organization's slug (in its address) or id", required: true }
      - { name: query, label: "Only issues this search finds (is:unresolved unless given)" }
    poll:
      action: list_issues
      input: { organization_id_or_slug: "{{ input.organization_id_or_slug }}", query: "{{ input.query }}", sort: new }
      newest_first: true
      id: item.id
      every: 5m
  issue_changed:
    label: An issue created, resolved, assigned, archived or unresolved
    description: >-
      Each change to an issue, as Sentry sends it to an internal integration's webhook, signed with the
      integration's client secret.
    inputs:
      - { name: actions, label: "Only these (with commas): created, resolved, assigned, archived, unresolved; all by default" }
    webhook:
      signature: { header: sentry-hook-signature, encoding: hex }
      secret: webhook_secret
      id: "headers['request-id']"
      only: "headers['sentry-hook-resource'] == 'issue' && (input.actions == null || value.action in input.actions.split(','))"
      event: "{'action': value.action, 'issue': value.data.issue, 'actor': value.actor}"
      setup: >-
        In Sentry, Settings → Developer Settings: add an internal integration with this address as its webhook URL,
        read access to issues and events, and the issue webhooks chosen. Put its Client Secret in this credential's
        webhook secret.
