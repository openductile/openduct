      headers: { Link: '<https://us.sentry.io/api/0/organizations/acme/issues/?sort=new&cursor=0:0:1>; rel="previous"; results="false"; cursor="0:0:1", <https://us.sentry.io/api/0/organizations/acme/issues/?sort=new&cursor=0:100:0>; rel="next"; results="true"; cursor="0:100:0"' }
