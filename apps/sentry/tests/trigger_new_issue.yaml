        - { id: "4500000003", shortId: SHOP-WEB-5, title: "Error: payment timed out", level: error, status: unresolved, firstSeen: "2026-11-27T10:05:00Z" }
        - { id: "4500000002", shortId: SHOP-WEB-4, title: "TypeError: price is null", level: error, status: unresolved, firstSeen: "2026-11-27T09:40:00Z" }
        - { id: "4500000001", shortId: SHOP-WEB-3, title: "TypeError: cart is undefined", level: error, status: unresolved, firstSeen: "2026-11-26T08:00:00Z" }
runs:
