description: Issues first seen since the poll before, the newest asked for; listing stops at one seen before
trigger: new_issue
credential: { token: sntrys_test }
input: { organization_id_or_slug: acme }
seen: { items: [["4500000001", ""]] }
exchanges:
  - sent:
      method: GET
      url: https://us.sentry.io/api/0/organizations/acme/issues/
      query: { sort: new }
      headers: { authorization: Bearer sntrys_test }
