description: 'Documents by a field: a text compared, equal by default'
action: find_documents
credential:
  access_token: ya29.test
input:
  project_id: sample-shop
  collection: orders
  field: status
  value: new
  limit: 10
exchanges:
- sent:
    method: POST
    url: https://firestore.googleapis.com/v1/projects/sample-shop/databases/(default)/documents:runQuery
    headers:
      authorization: Bearer ya29.test
    body:
      structuredQuery:
        from:
        - collectionId: orders
        where:
          fieldFilter:
            field:
              fieldPath: status
            op: EQUAL
            value:
              stringValue: new
        limit: 10
  answer:
    status: 200
    body:
    - document:
        name: projects/sample-shop/databases/(default)/documents/orders/A-100
        fields: &id001
          customer:
            stringValue: Pat Sample
          total:
            doubleValue: 42.5
          items:
            integerValue: '3'
          paid:
            booleanValue: true
          status:
            stringValue: new
        createTime: '2026-11-20T10:00:00.000000Z'
        updateTime: '2026-11-20T10:00:00.000000Z'
      readTime: '2026-11-21T08:00:00.000000Z'
    - document:
        name: projects/sample-shop/databases/(default)/documents/orders/A-101
        fields: *id001
        createTime: '2026-11-20T10:00:00.000000Z'
        updateTime: '2026-11-20T10:00:00.000000Z'
      readTime: '2026-11-21T08:00:00.000000Z'
result:
- name: projects/sample-shop/databases/(default)/documents/orders/A-100
  fields: *id001
  createTime: '2026-11-20T10:00:00.000000Z'
  updateTime: '2026-11-20T10:00:00.000000Z'
- name: projects/sample-shop/databases/(default)/documents/orders/A-101
  fields: *id001
  createTime: '2026-11-20T10:00:00.000000Z'
  updateTime: '2026-11-20T10:00:00.000000Z'
