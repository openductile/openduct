# Vonage: written by hand from Vonage's own API descriptions (OpenAPI 3), fetched 2026-11-27 from
# https://developer.vonage.com/api/v1/developer/api/file/<api>?format=json&vendorId=vonage - messages (1.22.0,
# Apache 2.0), verify.v2 (2.1.1), account (1.0.4, Apache 2.0), numbers (1.1.0, MIT), number-insight (1.2.1, MIT),
# pricing (1.3.0).
app: vonage
name: Vonage
category: messaging
description: "Texts, WhatsApp, Viber, Messenger and RCS messages, one-time codes, and phone numbers, with Vonage."
docs: https://developer.vonage.com/en/api/messages
hosts: [api.nexmo.com, rest.nexmo.com]
base_url: https://api.nexmo.com
sign_in:
  - id: vonage
    label: "An API key and secret"
    fields:
      - { name: api_key, label: The API key }
      - { name: api_secret, label: The API secret, secret: true }
    basic: { username: "{{ credential.api_key }}", password: "{{ credential.api_secret }}" }
# Vonage's newer APIs answer a problem record; the older ones an error code and label.
error: >-
  status < 400 ? null
  : (has(value.invalid_parameters) && value.invalid_parameters != null && size(value.invalid_parameters) > 0
    ? value.title + ': ' + value.invalid_parameters.map(p, p.name + ' - ' + p.reason).join('; ')
    : (has(value.detail) && value.detail != null ? value.title + ': ' + value.detail
    : (has(value.title) ? value.title
    : ('error-code-label' in value ? value['error-code-label'] : null))))
actions:
  send_sms:
    label: Send a text message (SMS)
    description: "A text to a phone number, from one of your numbers or a sender name where the country allows it."
    write: true
    method: POST
    path: /v1/messages
    inputs: &phone_text
      - { name: to, label: "To: the phone number with its country code, no + (such as 14155550100)", required: true }
      - { name: from, label: "From: your Vonage number, or a sender name", required: true }
      - { name: text, label: The message, required: true }
      - { name: client_ref, label: "A reference of your own, given back in its status" }
    send:
      channel: sms
      message_type: text
      to: "{{ input.to }}"
      from: "{{ input.from }}"
      text: "{{ input.text }}"
      client_ref: "{{ input.client_ref }}"
    output: &sent { message_uuid: text, workflow_id: text }
  send_mms:
    label: Send a picture message (MMS)
    description: "A picture, with a caption, to a phone number in the US or Canada, from one of your numbers."
    write: true
    method: POST
    path: /v1/messages
    inputs: &media
      - { name: to, label: "To: the phone number with its country code, no +", required: true }
      - { name: from, label: "From: your Vonage number", required: true }
      - { name: image_url, label: "The picture's address (a public https link)", required: true }
      - { name: caption, label: A caption }
      - { name: client_ref, label: "A reference of your own, given back in its status" }
    send:
      channel: mms
      message_type: image
      to: "{{ input.to }}"
      from: "{{ input.from }}"
      image: { url: "{{ input.image_url }}", caption: "{{ input.caption }}" }
      client_ref: "{{ input.client_ref }}"
    output: *sent
  send_whatsapp:
    label: Send a WhatsApp message
    description: "A WhatsApp text from your business number, to someone who wrote to you in the last 24 hours."
    write: true
    method: POST
    path: /v1/messages
    inputs: *phone_text
    send:
      channel: whatsapp
      message_type: text
      to: "{{ input.to }}"
      from: "{{ input.from }}"
      text: "{{ input.text }}"
      client_ref: "{{ input.client_ref }}"
    output: *sent
  send_whatsapp_template:
    label: Send a WhatsApp template message
    description: "A WhatsApp message from one of your approved templates, its blanks filled in: to anyone who agreed to hear from you."
    write: true
    method: POST
    path: /v1/messages
    inputs:
      - { name: to, label: "To: the phone number with its country code, no +", required: true }
      - { name: from, label: "From: your WhatsApp business number", required: true }
      - { name: template, label: "The template's name", required: true }
      - { name: parameters, label: "What fills its blanks, in order: the first, the second ...", kind: list }
      - { name: locale, label: "Its language, such as en_US", required: true }
      - { name: client_ref, label: "A reference of your own, given back in its status" }
    send:
      channel: whatsapp
      message_type: template
      to: "{{ input.to }}"
      from: "{{ input.from }}"
      template: { name: "{{ input.template }}", parameters: "{{ input.parameters }}" }
      whatsapp: { policy: deterministic, locale: "{{ input.locale }}" }
      client_ref: "{{ input.client_ref }}"
    output: *sent
  send_whatsapp_image:
    label: Send a picture on WhatsApp
    description: "A picture, with a caption, from your WhatsApp business number."
    write: true
    method: POST
    path: /v1/messages
    inputs: *media
    send:
      channel: whatsapp
      message_type: image
      to: "{{ input.to }}"
      from: "{{ input.from }}"
      image: { url: "{{ input.image_url }}", caption: "{{ input.caption }}" }
      client_ref: "{{ input.client_ref }}"
    output: *sent
  send_viber:
    label: Send a Viber message
    description: "A Viber Business message from your Viber service ID."
    write: true
    method: POST
    path: /v1/messages
    inputs:
      - { name: to, label: "To: the phone number with its country code, no +", required: true }
      - { name: from, label: "From: your Viber service ID", required: true }
      - { name: text, label: The message, required: true }
      - { name: category, label: "transaction (the default) or promotion" }
      - { name: client_ref, label: "A reference of your own, given back in its status" }
    send:
      channel: viber_service
      message_type: text
      to: "{{ input.to }}"
      from: "{{ input.from }}"
      text: "{{ input.text }}"
      viber_service: { category: "{{ input.category }}" }
      client_ref: "{{ input.client_ref }}"
    output: *sent
  send_messenger:
    label: Send a Facebook Messenger message
    description: "A Messenger message from your Facebook page, to someone who wrote to it."
    write: true
    method: POST
    path: /v1/messages
    inputs:
      - { name: to, label: "To: their Messenger ID (from their message)", required: true }
      - { name: from, label: "From: your Facebook page's ID", required: true }
      - { name: text, label: "The message (640 characters at most)", required: true }
      - { name: client_ref, label: "A reference of your own, given back in its status" }
    send:
      channel: messenger
      message_type: text
      to: "{{ input.to }}"
      from: "{{ input.from }}"
      text: "{{ input.text }}"
      client_ref: "{{ input.client_ref }}"
    output: *sent
  send_rcs:
    label: Send an RCS message
    description: "A rich text message (RCS) from your business sender, to a phone that takes them."
    write: true
    method: POST
    path: /v1/messages
    inputs:
      - { name: to, label: "To: the phone number with its country code, no +", required: true }
      - { name: from, label: "From: your RCS sender ID", required: true }
      - { name: text, label: The message, required: true }
      - { name: client_ref, label: "A reference of your own, given back in its status" }
    send:
      channel: rcs
      message_type: text
      to: "{{ input.to }}"
      from: "{{ input.from }}"
      text: "{{ input.text }}"
      client_ref: "{{ input.client_ref }}"
    output: *sent
  start_verification:
    label: Send a one-time code
    description: "A code to check someone's phone or email, by text, WhatsApp, voice call or email, with your brand's name."
    write: true
    method: POST
    path: /v2/verify
    inputs:
      - { name: brand, label: "Your brand's name, shown in the message", required: true }
      - { name: to, label: "To: the phone number with its country code, no + (or an email for email)", required: true }
      - { name: channel, label: "How: sms (the default), whatsapp, voice or email" }
      - { name: from, label: "From: your number or address (WhatsApp and email need one)" }
      - { name: code_length, label: "How many digits: 4 to 10", kind: number }
      - { name: locale, label: "The language, such as en-us" }
      - { name: client_ref, label: "A reference of your own" }
    send:
      brand: "{{ input.brand }}"
      workflow:
        - channel: "{{ has(input.channel) && input.channel != null ? input.channel : 'sms' }}"
          to: "{{ input.to }}"
          from: "{{ input.from }}"
      code_length: "{{ input.code_length }}"
      locale: "{{ input.locale }}"
      client_ref: "{{ input.client_ref }}"
    output: { request_id: text, check_url: text }
  check_code:
    label: Check a one-time code
    description: "Whether the code someone typed is the one sent (three tries at most); Vonage refuses a wrong one."
    write: true
    method: POST
    path: "/v2/verify/{{ input.request_id }}"
    inputs:
      - { name: request_id, label: "The request's ID (from Send a one-time code)", required: true }
      - { name: code, label: The code they typed, required: true }
    send: { code: "{{ input.code }}" }
    output: { request_id: text, status: text }
  cancel_verification:
    label: Cancel a one-time code
    description: "Stops a code being sent again or checked."
    write: true
    method: DELETE
    path: "/v2/verify/{{ input.request_id }}"
    inputs:
      - { name: request_id, label: "The request's ID", required: true }
    result: "{'cancelled': true}"
    output: { cancelled: boolean }
  lookup_number:
    label: Look up a phone number
    description: "A phone number's country and formats; at the standard level also its carrier, line type and whether it moved (paid)."
    method: GET
    path: "/ni/{{ has(input.level) && input.level != null ? input.level : 'basic' }}/json"
    inputs:
      - { name: number, label: "The phone number", required: true }
      - { name: country, label: "Its country (two letters, such as US), when the number has no country code" }
      - { name: level, label: "basic (the default, free) or standard" }
    query: { number: "{{ input.number }}", country: "{{ input.country }}" }
    # Number Insight answers 200 with a status of its own: 0 is success.
    error: "status >= 400 ? (has(value.title) ? value.title : null) : (has(value.status) && value.status != 0 ? value.status_message : null)"
    output:
      status: number
      status_message: text
      request_id: text
      international_format_number: text
      national_format_number: text
      country_code: text
      country_code_iso3: text
      country_name: text
      country_prefix: text
      current_carrier: record
      original_carrier: record
      ported: text
      request_price: text
      remaining_balance: text
  get_balance:
    label: Get the account balance
    description: "How much credit the account has, in euros, and whether it tops up by itself."
    method: GET
    by: { vonage: { url: https://rest.nexmo.com/account/get-balance } }
    output: { value: number, autoReload: boolean }
  list_numbers:
    label: List your numbers
    description: "The phone numbers the account has, with what each can do (SMS, voice, MMS); every page."
    method: GET
    by: { vonage: { url: https://rest.nexmo.com/account/numbers } }
    inputs:
      - { name: country, label: "Only in this country (two letters)" }
      - { name: pattern, label: "Only numbers that start with these digits" }
    query: { country: "{{ input.country }}", pattern: "{{ input.pattern }}", size: "100" }
    items: "has(value.numbers) ? value.numbers : []"
    next: "!has(value.numbers) || size(value.numbers) < 100 ? null : {'index': string((page == null ? 1 : int(page.index)) + 1)}"
    output: { country: text, msisdn: text, type: text, features: list, app_id: text, messagesCallbackValue: text }
  search_numbers:
    label: Find numbers to buy
    description: "Phone numbers free to buy in a country, with what each can do and costs (the first 100)."
    method: GET
    by: { vonage: { url: https://rest.nexmo.com/number/search } }
    inputs:
      - { name: country, label: "The country (two letters, such as US)", required: true }
      - { name: type, label: "landline, mobile-lvn or landline-toll-free" }
      - { name: features, label: "What it must do: SMS, VOICE, MMS, or several with commas" }
      - { name: pattern, label: "Digits it must start with" }
    query:
      country: "{{ input.country }}"
      type: "{{ input.type }}"
      features: "{{ input.features }}"
      pattern: "{{ input.pattern }}"
      size: "100"
    items: "has(value.numbers) ? value.numbers : []"
    output: { country: text, msisdn: text, type: text, cost: text, initialPrice: text, features: list }
  get_prices:
    label: Get prices for a country
    description: "What sending a text (sms) or making a call (voice) to a country costs, network by network."
    method: GET
    by: { vonage: { url: "https://rest.nexmo.com/account/get-pricing/outbound/{{ has(input.type) && input.type != null ? input.type : 'sms' }}" } }
    inputs:
      - { name: country, label: "The country (two letters, such as CA)", required: true }
      - { name: type, label: "sms (the default) or voice" }
    query: { country: "{{ input.country }}" }
    output: { countryCode: text, countryName: text, currency: text, defaultPrice: text, dialingPrefix: text, networks: list }
