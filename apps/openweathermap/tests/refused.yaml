description: A key not yet working, or wrong, is refused in OpenWeather's words
action: current_weather
credential: { api_key: wrong-key }
input: { lat: 1, lon: 1 }
exchanges:
  - answer: { status: 401, body: { cod: 401, message: "Invalid API key. Please see https://openweathermap.org/faq#error401 for more info." } }
error: "OpenWeatherMap answered 401: Invalid API key."
