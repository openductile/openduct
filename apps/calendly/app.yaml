app: calendly
name: Calendly
category: scheduling
description: Bookings made through Calendly, and who booked them.
docs: https://developer.calendly.com/api-docs
hosts: [api.calendly.com]
base_url: https://api.calendly.com
sign_in:
  - id: calendly
    label: A personal access token
    fields:
      - { name: token, label: The personal access token, secret: true }
      - { name: webhook_secret, label: "A webhook subscription's signing key, for one made elsewhere", secret: true, optional: true }
    headers:
      Authorization: "Bearer {{ credential.token }}"
error: value.message
actions:
  me:
    label: Who I am (my user's address, for the others)
    method: GET
    path: /users/me
    result: value.resource
  list_bookings:
    label: List bookings
    method: GET
    path: /scheduled_events
    inputs:
      - { name: user, label: "Whose: a user's address, from Who I am", required: true }
      - { name: status, label: "active or canceled" }
      - { name: min_start_time, label: "Starting from (such as 2026-11-01T00:00:00Z)" }
    query: { user: "{{ input.user }}", status: "{{ input.status }}", min_start_time: "{{ input.min_start_time }}", count: "100" }
    items: value.collection
    next: value.pagination.next_page
  list_invitees:
    label: Who booked a booking
    method: GET
    path: "/scheduled_events/{{ input.event }}/invitees"
    inputs:
      - { name: event, label: "The booking's id (the end of its address)", required: true }
    query: { count: "100" }
    items: value.collection
    next: value.pagination.next_page
triggers:
  new_booking:
    label: A new booking (or one cancelled)
    description: >-
      Each booking made with you (or cancelled), as Calendly sends it, signed. Turning the workflow on subscribes its
      address to your bookings, and turning it off ends the subscription.
    inputs:
      - { name: events, label: "Which, separated by commas: invitee.created (a booking), invitee.canceled", description: "invitee.created when empty" }
    webhook:
      signature: { header: calendly-webhook-signature, pairs: { signature: v1, time: t }, signed: "{time}.{body}" }
      secret: webhook_secret
      id: "value.payload.uri + '#' + value.event"
      only: "(input.events == null ? ['invitee.created'] : input.events.split(',').map(e, e.trim())).exists(e, e == value.event)"
      event: "{'event': value.event, 'invitee': value.payload}"
      register:
        - { method: GET, path: /users/me }
        - method: POST
          path: /webhook_subscriptions
          send:
            url: "{{ input.address }}"
            events: "{{ input.events == null ? ['invitee.created'] : input.events.split(',').map(e, e.trim()) }}"
            organization: "{{ input.previous.resource.current_organization }}"
            user: "{{ input.previous.resource.uri }}"
            scope: user
            signing_key: "{{ input.secret }}"
      keep:
        webhook_secret: input.secret
        webhook_id: "value.resource.uri.split('/')[size(value.resource.uri.split('/')) - 1]"
      unregister:
        - { method: DELETE, path: "/webhook_subscriptions/{{ input.registered.webhook_id }}" }
