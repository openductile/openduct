app: supabase
name: Supabase
category: data
description: Rows of a Supabase project's tables, added, found, changed and removed.
docs: https://supabase.com/docs/guides/api
# A project's own address: https://<project>.supabase.co, or a Supabase of your own.
base_url_field: project_url
sign_in:
  - id: supabase
    label: "The project's address and a secret key"
    fields:
      - { name: project_url, label: "The project's address, such as https://abcdefgh.supabase.co" }
      - { name: api_key, label: "A secret key (sb_secret_...), or the older service_role key", secret: true }
    headers:
      apikey: "{{ credential.api_key }}"
      # An older key is a token, read from Authorization too; a new one goes in apikey alone.
      Authorization: "{{ credential.api_key.startsWith('eyJ') ? 'Bearer ' + credential.api_key : '' }}"
error: "status >= 400 ? value.message : null"
default_action: add_row
# Conditions are sent as one: and=(email.eq."ann@example.com",total.gt.100). A value is quoted, so a comma or a
# bracket in it is read as part of it; a value that is null is asked for as null (is.null).
actions:
  add_row:
    label: Add a row
    write: true
    method: POST
    path: "/rest/v1/{{ input.table }}"
    headers: { Prefer: return=representation }
    inputs:
      - { name: table, label: The table, required: true }
      - { name: row, label: "The row: each column and its value", required: true, kind: record }
    send: "{{ input.row }}"
    result: "size(value) == 1 ? value[0] : value"
  list_rows:
    label: Find rows
    description: The rows that have the values given (every row when none are), up to 10,000.
    method: GET
    path: "/rest/v1/{{ input.table }}"
    inputs:
      - { name: table, label: The table, required: true }
      - { name: match, label: "Only rows with these values: each column and its value", kind: record }
      - { name: where, label: "And other conditions, as column.operator.value with commas: total.gt.100,status.neq.closed" }
      - { name: columns, label: "Only these columns, with commas (every column when empty)" }
      - { name: order, label: "In the order of a column: created_at.desc" }
      - { name: limit, label: "At most this many rows (under 1,000)", kind: number }
    query:
      select: "{{ has(input.columns) && input.columns != null ? input.columns : '*' }}"
      and: >-
        {{ (has(input.match) && input.match != null && size(input.match) > 0) || (has(input.where) && input.where != null)
        ? '(' + ((has(input.match) && input.match != null
        ? input.match.map(k, input.match[k] == null ? k + '.is.null' : k + '.eq."' + string(input.match[k]).replace('"', '\\"') + '"')
        : []) + (has(input.where) && input.where != null ? [input.where] : [])).join(',') + ')' : null }}
      order: "{{ input.order }}"
      limit: "{{ has(input.limit) && input.limit != null ? input.limit : 1000 }}"
    items: value
    # Supabase gives at most 1,000 rows at a time: a full page means there may be more.
    next: "size(value) < 1000 ? null : {'offset': (page == null ? 0 : int(page.offset)) + 1000}"
  update_rows:
    label: Change rows
    description: Gives the rows that have the values given new ones, and gives those rows as they are now.
    write: true
    method: PATCH
    path: "/rest/v1/{{ input.table }}"
    headers: { Prefer: return=representation }
    inputs:
      - { name: table, label: The table, required: true }
      - { name: match, label: "Which rows: each column and the value it has now (id, say)", required: true, kind: record }
      - { name: where, label: "And other conditions, as column.operator.value with commas" }
      - { name: set, label: "What changes: each column and its new value", required: true, kind: record }
    query:
      # Never every row: no condition at all is sent as (), which Supabase refuses.
      and: >-
        {{ '(' + (input.match.map(k, input.match[k] == null ? k + '.is.null' : k + '.eq."' + string(input.match[k]).replace('"', '\\"') + '"')
        + (has(input.where) && input.where != null ? [input.where] : [])).join(',') + ')' }}
    send: "{{ input.set }}"
    items: value
  delete_rows:
    label: Remove rows
    description: Removes the rows that have the values given, and gives what was removed.
    write: true
    method: DELETE
    path: "/rest/v1/{{ input.table }}"
    headers: { Prefer: return=representation }
    inputs:
      - { name: table, label: The table, required: true }
      - { name: match, label: "Which rows: each column and its value (id, say)", required: true, kind: record }
      - { name: where, label: "And other conditions, as column.operator.value with commas" }
    query:
      and: >-
        {{ '(' + (input.match.map(k, input.match[k] == null ? k + '.is.null' : k + '.eq."' + string(input.match[k]).replace('"', '\\"') + '"')
        + (has(input.where) && input.where != null ? [input.where] : [])).join(',') + ')' }}
    items: value
