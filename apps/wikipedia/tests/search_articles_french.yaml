      method: GET
      url: https://fr.wikipedia.org/w/rest.php/v1/search/page
      query: { q: système solaire }
      headers: { authorization: Bearer test-wikimedia-token }
    answer: { body: { pages: [{ id: 1123, key: Système_solaire, title: Système solaire, excerpt: "...", description: null, thumbnail: null }] } }
